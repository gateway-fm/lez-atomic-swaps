[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # Exact rust-bitcoin graph adopted by the M3 P2TR transaction slice. These
    # are permissive upstream licenses, kept version-scoped so graph drift
    # cannot silently broaden the workspace policy.
    { crate = "base58ck@0.1.101", allow = ["CC0-1.0"] },
    { crate = "bitcoin@0.32.101", allow = ["CC0-1.0"] },
    { crate = "bitcoin-consensus-encoding@1.0.0", allow = ["CC0-1.0"] },
    { crate = "bitcoin-internals@0.5.0", allow = ["CC0-1.0"] },
    { crate = "bitcoin-io@0.1.101", allow = ["CC0-1.0"] },
    { crate = "bitcoin-units@0.1.101", allow = ["CC0-1.0"] },
    { crate = "bitcoin_hashes@0.14.101", allow = ["CC0-1.0"] },
    { crate = "bounded-vec@0.9.0", allow = ["CC0-1.0"] },
    { crate = "hex-conservative@0.2.2", allow = ["CC0-1.0"] },
    { crate = "hex-conservative@0.3.2", allow = ["CC0-1.0"] },
    { crate = "hex_lit@0.1.1", allow = ["MITNFA"] },
    { crate = "secp256k1@0.29.1", allow = ["CC0-1.0"] },
    { crate = "secp256k1-sys@0.10.1", allow = ["CC0-1.0"] },
    # These exact rustls-platform-verifier dependencies contain Mozilla CA
    # certificate data under the permissive, non-copyleft CDLA-Permissive-2.0.
    { crate = "webpki-root-certs@0.26.11", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-root-certs@1.0.8", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
