worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  # Plain HTTP on the private Docker network, TLS to a keyless public Bitcoin testnet3 RPC provider (PublicNode).
  server {
    listen 18443;
    client_max_body_size 4m;
    location = / {
      set $upstream https://bitcoin-testnet-rpc.publicnode.com;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host bitcoin-testnet-rpc.publicnode.com;
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_ssl_name bitcoin-testnet-rpc.publicnode.com;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 4;
      proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
      proxy_read_timeout 120s;
    }
  }
}
