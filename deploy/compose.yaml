name: lez-swap-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Bitcoin regtest ────────────────────────────────────────────────────
  bitcoin-init:
    image: debian:bookworm-slim
    container_name: lez-bitcoin-init
    volumes:
      - bitcoin_core_data:/var/lib/bitcoin
    command: ["chown", "-R", "65532:65532", "/var/lib/bitcoin"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  bitcoin-core:
    build: ./images/bitcoin-core
    image: lez-bitcoin-core:local
    container_name: lez-bitcoin-core
    depends_on:
      bitcoin-init:
        condition: service_completed_successfully
    command:
      - "-conf=/run-config/bitcoin.conf"
      - "-datadir=/var/lib/bitcoin"
      - "-printtoconsole"
    environment:
      HOME: /tmp
    labels:
      org.logos-co.atomic-swaps.run: market-btc-0001
      org.logos-co.atomic-swaps.scope: bitcoin-core-regtest-e2e
      org.logos-co.atomic-swaps.component: bitcoin-core
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - ./runtime/btc/bitcoin.conf:/run-config/bitcoin.conf:ro
      - bitcoin_core_data:/var/lib/bitcoin
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/bitcoin-cli", "-conf=/run-config/bitcoin.conf", "-datadir=/var/lib/bitcoin", "-rpcwait", "getblockchaininfo"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    restart: unless-stopped
    logging: *default-logging

  btc-miner:
    build: ./images/btc-miner
    image: lez-btc-miner:local
    container_name: lez-btc-miner
    depends_on:
      bitcoin-core:
        condition: service_healthy
    volumes:
      - ./runtime/btc/bitcoin.conf:/run-config/bitcoin.conf:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/btc-miner.sh"]
    environment:
      BTC_CONF: /run-config/bitcoin.conf
      BTC_RPC_HOST: bitcoin-core
      MINE_INTERVAL: "${MINE_INTERVAL:-120}"
    networks: [chains]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  btc-explorer:
    build: ./images/btc-explorer
    image: lez-btc-explorer:local
    container_name: lez-btc-explorer
    depends_on:
      bitcoin-core:
        condition: service_healthy
    environment:
      BTCEXP_BITCOIND_URI: http://lezrpc:${BTC_RPC_PASSWORD:?run scripts/up.sh first}@bitcoin-core:18443
      BTCEXP_ADDRESS_API: none
    ports:
      - "127.0.0.1:3002:3002"
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ─── LEZ v0.2 devnet ────────────────────────────────────────────────────
  bedrock:
    image: "ghcr.io/logos-blockchain/logos-blockchain@sha256:91d6c5bf07e07fcfba5e7cf07d21ee686a6bc4b9f6210f2d28bffbcad9a3729f"
    container_name: lez-bedrock
    entrypoint: ["/usr/bin/logos-blockchain-node"]
    command:
      - "/opt/lez-v0.2-source/bedrock/node-config.yaml"
      - "--deployment"
      - "/run-config/deployment-settings.yaml"
    environment:
      HOME: /tmp
      POL_PROOF_DEV_MODE: "true"
    labels:
      org.logos-co.atomic-swaps.run: market-lez-0001
      org.logos-co.atomic-swaps.scope: lez-v0.2-local-devnet
      org.logos-co.atomic-swaps.component: bedrock
    working_dir: /work
    volumes:
      - ./assets/lez-source/bedrock:/opt/lez-v0.2-source/bedrock:ro
      - ./assets/lez-source/bedrock/kzgrs_test_params:/kzgrs_test_params:ro
      - ./runtime/config/deployment-settings.yaml:/run-config/deployment-settings.yaml:ro
      - ./runtime/bedrock:/work/state
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    cpus: 2.0
    mem_limit: 4g
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *default-logging

  sequencer:
    build: ./images/lez-services
    image: lez-services:local
    container_name: lez-sequencer
    entrypoint: ["/usr/local/bin/sequencer_service"]
    command: ["/run-config/sequencer_config.json", "--port", "3040"]
    environment:
      HOME: /tmp
      RUST_LOG: info
      RISC0_SERVER_PATH: /usr/local/bin/r0vm
    labels:
      org.logos-co.atomic-swaps.run: market-lez-0001
      org.logos-co.atomic-swaps.scope: lez-v0.2-local-devnet
      org.logos-co.atomic-swaps.component: sequencer
    ports:
      - "127.0.0.1:3040:3040"
    depends_on: [bedrock]
    volumes:
      - ./runtime/config/sequencer_config.json:/run-config/sequencer_config.json:ro
      - ./runtime/sequencer:/var/lib/sequencer_service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g,mode=1777
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 1024
    cpus: 4.0
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "tcp", "127.0.0.1:3040", "getBlock", "[1]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  indexer:
    image: lez-services:local
    container_name: lez-indexer
    entrypoint: ["/usr/local/bin/indexer_service"]
    command:
      - "/run-config/indexer_config.json"
      - "--port"
      - "8779"
      - "--data-dir"
      - "/var/lib/indexer_service"
    environment:
      HOME: /tmp
      RUST_LOG: info
      RISC0_SERVER_PATH: /usr/local/bin/r0vm
    labels:
      org.logos-co.atomic-swaps.run: market-lez-0001
      org.logos-co.atomic-swaps.scope: lez-v0.2-local-devnet
      org.logos-co.atomic-swaps.component: indexer
    ports:
      - "127.0.0.1:8779:8779"
    depends_on:
      sequencer:
        condition: service_healthy
    volumes:
      - ./runtime/config/indexer_config.json:/run-config/indexer_config.json:ro
      - ./runtime/indexer:/var/lib/indexer_service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "tcp", "127.0.0.1:8779", "getLastFinalizedBlockId", "[]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *default-logging

  lez-explorer:
    build: ./images/lez-explorer
    image: lez-explorer:local
    container_name: lez-lez-explorer
    depends_on:
      indexer:
        condition: service_healthy
    environment:
      LEZ_INDEXER_URL: http://indexer:8779
      M3_BTC_EVIDENCE_FILE: /run/lez-evidence/m3-btc-ui-evidence.json
      LEZ_M3_EVIDENCE_ROOT: /runner-repo
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ./runtime/m3-btc-ui-evidence.json:/run/lez-evidence/m3-btc-ui-evidence.json:ro
      - ${LEZ_M3_RUNNER_REPO}:/runner-repo:ro
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ─── swap application ───────────────────────────────────────────────────
  # Loopback routes inside bitcoin-core's network namespace: the role sidecars
  # (and only they) accept literal-loopback LEZ node endpoints, so the
  # sequencer and indexer appear at 127.0.0.1 for every Node sharing the
  # namespace. Pure plumbing; it holds no keys and sees no secrets.
  lez-routes:
    image: alpine/socat:1.8.0.0
    container_name: lez-routes
    depends_on:
      bitcoin-core:
        condition: service_healthy
      sequencer:
        condition: service_healthy
      indexer:
        condition: service_healthy
    network_mode: "service:bitcoin-core"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        socat TCP-LISTEN:3040,bind=127.0.0.1,fork,reuseaddr TCP:sequencer:3040 &
        exec socat TCP-LISTEN:8779,bind=127.0.0.1,fork,reuseaddr TCP:indexer:8779
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    logging: *default-logging

  maker-init:
    image: debian:bookworm-slim
    container_name: lez-maker-init
    volumes:
      - maker_state:/var/lib/lez/maker
      - maker_socket:/run/lez/maker
      - delivery_dir:/delivery
    command: ["bash", "-c", "chown 4713:4713 /var/lib/lez/maker /run/lez/maker /delivery && chmod 0700 /run/lez/maker /delivery"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  maker-node:
    build: ./images/maker-node
    image: lez-maker-node:local
    container_name: lez-maker-node
    depends_on:
      maker-init:
        condition: service_completed_successfully
      bitcoin-core:
        condition: service_healthy
      indexer:
        condition: service_healthy
      lez-routes:
        condition: service_started
    # Shares bitcoin-core's network namespace: the actor and the funding wallet
    # reach Core at literal loopback, and the role's LEZ sidecar listens on
    # loopback too. Everything else reaches this Node over its Unix sockets.
    network_mode: "service:bitcoin-core"
    command: ["/usr/local/bin/node-entrypoint.sh", "maker"]
    environment:
      LEZ_SIDECAR_PORT_BASE: "19000"
      LEZ_SEQUENCER_URL: http://127.0.0.1:3040
      LEZ_INDEXER_URL: http://127.0.0.1:8779
      LEZ_V02_CHANNEL_ID: ${LEZ_V02_CHANNEL_ID}
      LEZ_BTC_WALLET: lez-maker
    volumes:
      - maker_state:/var/lib/lez/maker
      - maker_socket:/run/lez/maker
      - delivery_dir:/delivery
      - ./runtime/lez/maker:/run-lez-identity:ro
      - ./runtime/secrets/btc-rpc-cookie:/run-config/btc-rpc-cookie:ro
      - ${LEZ_MARKET_ROOT}:/run-market:ro
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    user: lez
    read_only: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "uds", "/run/lez/maker/node.sock", "maker_health", "[{}]"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  taker-init:
    build: ./images/taker-node
    image: lez-taker-node:local
    container_name: lez-taker-init
    user: "0:0"
    volumes:
      - taker_state:/var/lib/lez/taker
      - taker_socket:/run/lez/taker
    command: ["bash", "-c", "chown 4713:4713 /var/lib/lez/taker /run/lez/taker && chmod 0700 /var/lib/lez/taker /run/lez/taker"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  taker-node:
    image: lez-taker-node:local
    container_name: lez-taker-node
    depends_on:
      taker-init:
        condition: service_completed_successfully
      maker-node:
        condition: service_healthy
    network_mode: "service:bitcoin-core"
    command: ["/usr/local/bin/node-entrypoint.sh", "taker"]
    environment:
      LEZ_SIDECAR_PORT_BASE: "19500"
      LEZ_SEQUENCER_URL: http://127.0.0.1:3040
      LEZ_INDEXER_URL: http://127.0.0.1:8779
      LEZ_V02_CHANNEL_ID: ${LEZ_V02_CHANNEL_ID}
      LEZ_BTC_WALLET: lez-taker
    volumes:
      - taker_state:/var/lib/lez/taker
      - taker_socket:/run/lez/taker
      - delivery_dir:/delivery:ro
      - maker_socket:/run/lez/maker
      - ./runtime/lez/taker:/run-lez-identity:ro
      - ./runtime/secrets/btc-rpc-cookie:/run-config/btc-rpc-cookie:ro
      - ${LEZ_MARKET_ROOT}:/run-market:ro
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    user: lez
    read_only: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "uds", "/run/lez/taker/node.sock", "taker_health", "[{\"schema_version\":1}]"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  btc-demo-init:
    image: python:3.12-alpine
    container_name: lez-btc-demo-init
    volumes:
      - btc_demo_socket:/run/lez-btc-demo
    command: ["sh", "-c", "chown 4713:4713 /run/lez-btc-demo && chmod 0700 /run/lez-btc-demo"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  # Local-demo-only host authority. The launcher accepts only the versioned
  # M3 job, approval, wait, and evidence operations implemented in launcher.py.
  btc-demo-launcher:
    build: ./images/btc-demo-launcher
    image: lez-btc-demo-launcher:local
    container_name: lez-btc-demo-launcher
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      LEZ_BTC_LAUNCHER_SOCKET: /run/lez-btc-launcher/launcher.sock
      LEZ_M3_RUNNER_CONTAINER: ${LEZ_M3_RUNNER_CONTAINER:-lez-runner-arm}
      LEZ_M3_RUNNER_REPO_IN_CONTAINER: ${LEZ_M3_RUNNER_REPO_IN_CONTAINER:?run scripts/gen-config.sh first}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - btc_launcher_socket:/run/lez-btc-launcher
    tmpfs:
      - /tmp:rw,nosuid,size=16m,mode=1777
    networks: [chains]
    read_only: true
    cap_drop: [ALL]
    # The launcher starts as root to reach the host Docker socket and opens its
    # own socket to the controller's group; changing that group needs CAP_CHOWN.
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "/app/launcher.py", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  btc-demo-controller:
    build: ./images/btc-demo-controller
    image: lez-btc-demo-controller:local
    container_name: lez-btc-demo-controller
    depends_on:
      btc-demo-init:
        condition: service_completed_successfully
      btc-demo-launcher:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      LEZ_BTC_DEMO_SOCKET: /run/lez-btc-demo/controller.sock
      LEZ_BTC_LAUNCHER_SOCKET: /run/lez-btc-launcher/launcher.sock
      LEZ_M3_EVIDENCE_ROOT: /runner-repo
      LEZ_M3_BTC_EVIDENCE_FILE: /run/evidence/m3-btc-ui-evidence.json
    volumes:
      - ./full-swap:/controller-assets:ro
      - ${LEZ_M3_RUNNER_REPO}:/runner-repo:ro
      - ./runtime/m3-btc-ui-evidence.json:/run/evidence/m3-btc-ui-evidence.json
      - btc_demo_socket:/run/lez-btc-demo
      - btc_launcher_socket:/run/lez-btc-launcher:ro
    tmpfs:
      - /tmp:rw,nosuid,size=16m,mode=1777
    networks: [chains]
    user: "4713:4713"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  basecamp-ui:
    build: ./images/basecamp-ui
    image: lez-basecamp-ui:local
    container_name: lez-basecamp-ui
    depends_on:
      maker-node:
        condition: service_healthy
      taker-node:
        condition: service_healthy
      btc-demo-controller:
        condition: service_healthy
    environment:
      BASECAMP_ROLE: ${BASECAMP_ROLE:-both}
      VNC_PASSWORD: ${VNC_PASSWORD:-lezswap}
      LEZ_MAKER_RPC_SOCKET: /run/lez/maker/node.sock
      LEZ_TAKER_RPC_SOCKET: /run/lez/taker/node.sock
      LEZ_BTC_DEMO_RPC_SOCKET: /run/lez-btc-demo/controller.sock
      LEZ_M3_BTC_EVIDENCE_FILE: /run/lez-evidence/m3-btc-ui-evidence.json
      M3_UI_DIRECTION: ${M3_UI_DIRECTION:-TakerSellsForeign}
    volumes:
      - maker_socket:/run/lez/maker:ro
      - taker_socket:/run/lez/taker:ro
      - btc_demo_socket:/run/lez-btc-demo:ro
      - ./runtime/m3-btc-ui-evidence.json:/run/lez-evidence/m3-btc-ui-evidence.json:ro
      - ./ui-tests:/ui-tests:ro
    ports:
      - "127.0.0.1:5901:5900"
    networks: [chains]
    user: "4713:4713"
    init: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

networks:
  chains:
    name: lez-swap-chains
    driver: bridge

volumes:
  bitcoin_core_data:
    name: lez-bitcoin-core-data
  maker_state:
    name: lez-maker-state
  maker_socket:
    name: lez-maker-socket
  taker_state:
    name: lez-taker-state
  taker_socket:
    name: lez-taker-socket
  delivery_dir:
    name: lez-delivery-dir
  btc_demo_socket:
    name: lez-btc-demo-socket
  btc_launcher_socket:
    name: lez-btc-launcher-socket
