name: lez-swap-stack

# Images are named ${LEZ_IMAGE_PREFIX}-<service>:${LEZ_IMAGE_TAG}. The default
# (lez-<service>:local) is what `docker compose build` produces on this host;
# a release sets the prefix to the registry path and the tag to the release
# (ghcr.io/gateway-fm/lez-atomic-swaps/lez-maker-node:v0.2.1) so the same
# file runs prebuilt images (scripts/start.sh) or locally built ones (up.sh).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Bitcoin regtest ────────────────────────────────────────────────────
  bitcoin-init:
    image: debian:bookworm-slim
    container_name: lez-bitcoin-init
    volumes:
      - bitcoin_core_data:/var/lib/bitcoin
    command: ["chown", "-R", "65532:65532", "/var/lib/bitcoin"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  bitcoin-core:
    build: ./images/bitcoin-core
    image: ${LEZ_IMAGE_PREFIX:-lez}-bitcoin-core:${LEZ_IMAGE_TAG:-local}
    container_name: lez-bitcoin-core
    depends_on:
      bitcoin-init:
        condition: service_completed_successfully
    command:
      - "-conf=/run-config/bitcoin.conf"
      - "-datadir=/var/lib/bitcoin"
      - "-printtoconsole"
    environment:
      HOME: /tmp
    labels:
      org.logos-co.atomic-swaps.run: market-btc-0001
      org.logos-co.atomic-swaps.scope: bitcoin-core-regtest-e2e
      org.logos-co.atomic-swaps.component: bitcoin-core
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - ./runtime/btc/bitcoin.conf:/run-config/bitcoin.conf:ro
      - bitcoin_core_data:/var/lib/bitcoin
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/bitcoin-cli", "-conf=/run-config/bitcoin.conf", "-datadir=/var/lib/bitcoin", "-rpcwait", "getblockchaininfo"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 180s
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    restart: unless-stopped
    logging: *default-logging

  zebra-init:
    image: debian:bookworm-slim
    container_name: lez-zebra-init
    volumes:
      - zebra_data:/var/lib/zebra
    command: ["chown", "-R", "65532:65532", "/var/lib/zebra"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  # Zcash Regtest for the LEZ <-> ZEC pair, alongside bitcoin-core for BTC.
  # Same digest-pinned upstream build as the isolated lane in tests/e2e/zebra.
  zebra:
    build: ./images/zebra
    image: ${LEZ_IMAGE_PREFIX:-lez}-zebra:${LEZ_IMAGE_TAG:-local}
    container_name: lez-zebra
    depends_on:
      zebra-init:
        condition: service_completed_successfully
    command:
      - "--config"
      - "/run-config/zebrad.toml"
      - "start"
    environment:
      HOME: /tmp
      ZEBRA_RPC__COOKIE_DIR: /tmp
    labels:
      org.logos-co.atomic-swaps.run: market-zec-0001
      org.logos-co.atomic-swaps.scope: zebra-regtest-e2e
      org.logos-co.atomic-swaps.component: zebra
    ports:
      - "127.0.0.1:18232:18232"
    volumes:
      # Rendered by scripts/gen-config.sh from assets/zebra/zebrad.toml: the
      # miner_address is the Maker's minted Zcash key (runtime/lez/maker/zcash.key).
      - ./runtime/zebra/zebrad.toml:/run-config/zebrad.toml:ro
      - zebra_data:/var/lib/zebra
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "tcp", "127.0.0.1:18232", "getblockchaininfo", "[]"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 180s
    networks: [chains]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s

  btc-miner:
    build: ./images/btc-miner
    image: ${LEZ_IMAGE_PREFIX:-lez}-btc-miner:${LEZ_IMAGE_TAG:-local}
    container_name: lez-btc-miner
    depends_on:
      bitcoin-core:
        condition: service_healthy
    volumes:
      - ./runtime/btc/bitcoin.conf:/run-config/bitcoin.conf:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/btc-miner.sh"]
    environment:
      BTC_CONF: /run-config/bitcoin.conf
      BTC_RPC_HOST: bitcoin-core
      MINE_INTERVAL: "${MINE_INTERVAL:-120}"
    networks: [chains]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  btc-explorer:
    build: ./images/btc-explorer
    image: ${LEZ_IMAGE_PREFIX:-lez}-btc-explorer:${LEZ_IMAGE_TAG:-local}
    container_name: lez-btc-explorer
    depends_on:
      bitcoin-core:
        condition: service_healthy
    environment:
      BTCEXP_BITCOIND_URI: http://lezrpc:${BTC_RPC_PASSWORD:?run scripts/up.sh first}@bitcoin-core:18443
      BTCEXP_ADDRESS_API: none
    ports:
      - "127.0.0.1:3002:3002"
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ─── LEZ v0.2 devnet ────────────────────────────────────────────────────
  lez-init:
    image: debian:bookworm-slim
    container_name: lez-state-init
    volumes:
      - ./runtime/bedrock:/state/bedrock
      - ./runtime/sequencer:/state/sequencer
      - ./runtime/indexer:/state/indexer
    command: ["chown", "-R", "65532:65532", "/state/bedrock", "/state/sequencer", "/state/indexer"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  # The LEZ v0.2 network node, run as the Logos module a Basecamp user
  # installs (blockchain_module 0.2.4, node 0.2.4) inside a Basecamp
  # (images/lez-network-module): its LEZ Network desk starts the node with the
  # config and deployment settings below. It keeps the bedrock contract: the
  # same config and deployment files, the node HTTP API on bedrock:18080, the
  # state under runtime/bedrock (the Basecamp user directory with it).
  bedrock:
    build:
      context: ./images/lez-network-module
      additional_contexts:
        basecamp: service:basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-network-module:${LEZ_IMAGE_TAG:-local}
    container_name: lez-bedrock
    depends_on:
      lez-init:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      POL_PROOF_DEV_MODE: "true"
      LEZ_NETWORK_NODE_CONFIG: /opt/lez-v0.2-source/bedrock/node-config.yaml
      LEZ_NETWORK_NODE_DEPLOYMENT: /run-config/deployment-settings.yaml
    labels:
      org.logos-co.atomic-swaps.run: market-lez-0001
      org.logos-co.atomic-swaps.scope: lez-v0.2-local-devnet
      org.logos-co.atomic-swaps.component: bedrock
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18080"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    working_dir: /work
    volumes:
      - ./assets/lez-source/bedrock:/opt/lez-v0.2-source/bedrock:ro
      - ./assets/lez-source/bedrock/kzgrs_test_params:/kzgrs_test_params:ro
      - ./runtime/config/deployment-settings.yaml:/run-config/deployment-settings.yaml:ro
      - ./runtime/bedrock:/work/state
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    cpus: 2.0
    mem_limit: 4g
    # The LEZ processes shut down cleanly on Ctrl-C only and ignore SIGTERM, so
    # a default stop waits out the grace period and kills them mid-write.
    stop_signal: SIGINT
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *default-logging

  sequencer:
    build: ./images/lez-services
    image: ${LEZ_IMAGE_PREFIX:-lez}-services:${LEZ_IMAGE_TAG:-local}
    container_name: lez-sequencer
    entrypoint: ["/usr/local/bin/sequencer_service"]
    command: ["/run-config/sequencer_config.json", "--port", "3040"]
    environment:
      HOME: /tmp
      RUST_LOG: info
      RISC0_SERVER_PATH: /usr/local/bin/r0vm
    labels:
      org.logos-co.atomic-swaps.run: market-lez-0001
      org.logos-co.atomic-swaps.scope: lez-v0.2-local-devnet
      org.logos-co.atomic-swaps.component: sequencer
    ports:
      - "127.0.0.1:3040:3040"
    depends_on: [bedrock]
    volumes:
      - ./runtime/config/sequencer_config.json:/run-config/sequencer_config.json:ro
      - ./runtime/sequencer:/var/lib/sequencer_service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g,mode=1777
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 1024
    cpus: 4.0
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "tcp", "127.0.0.1:3040", "getBlock", "[1]"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 180s
      start_interval: 2s
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # The LEZ v0.2 indexer as a Logos module: lez_indexer_module (1.1.1 source on
  # LEZ v0.2.4, plus serve_rpc in builder/patches/lez-indexer-module) inside a
  # Basecamp (images/lez-indexer-module): its LEZ Network desk starts it, and
  # the module serves indexer_service's own JSON-RPC on :8779, so the Nodes,
  # the sidecar and the probes read it as before.
  indexer:
    build:
      context: ./images/lez-indexer-module
      additional_contexts:
        basecamp: service:basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-indexer-module:${LEZ_IMAGE_TAG:-local}
    container_name: lez-indexer
    environment:
      HOME: /tmp
      LEZ_INDEXER_CONFIG: /run-config/indexer_config.json
      LEZ_INDEXER_RPC_PORT: "8779"
    labels:
      org.logos-co.atomic-swaps.run: market-lez-0001
      org.logos-co.atomic-swaps.scope: lez-v0.2-local-devnet
      org.logos-co.atomic-swaps.component: indexer
    ports:
      - "127.0.0.1:8779:8779"
    depends_on:
      sequencer:
        condition: service_healthy
    volumes:
      - ./runtime/config/indexer_config.json:/run-config/indexer_config.json:ro
      - ./runtime/indexer:/work/state
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 512
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-indexer-module-health", "8779"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 180s
      start_interval: 2s
    stop_signal: SIGINT
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *default-logging

  lez-explorer:
    build: ./images/lez-explorer
    image: ${LEZ_IMAGE_PREFIX:-lez}-explorer:${LEZ_IMAGE_TAG:-local}
    container_name: lez-lez-explorer
    depends_on:
      indexer:
        condition: service_healthy
    environment:
      LEZ_INDEXER_URL: http://indexer:8779
      M3_BTC_EVIDENCE_FILE: /run/lez-evidence/m3-btc-ui-evidence.json
      LEZ_EVIDENCE_DIR: /run/lez-evidence/swaps
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ./runtime/m3-btc-ui-evidence.json:/run/lez-evidence/m3-btc-ui-evidence.json:ro
      - ./runtime/evidence:/run/lez-evidence/swaps:ro
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ─── swap application ───────────────────────────────────────────────────
  maker-init:
    image: debian:bookworm-slim
    container_name: lez-maker-init
    volumes:
      - maker_state:/var/lib/lez/maker
      - maker_socket:/run/lez/maker
      - zec_maker:/var/lib/lez/zec
      - delivery_dir:/delivery
      - maker_wallet:/run/lez-wallet/maker
    command: ["bash", "-c", "chown 4713:4713 /var/lib/lez/maker /run/lez/maker /var/lib/lez/zec /delivery /run/lez-wallet/maker && chmod 0700 /run/lez/maker /var/lib/lez/zec /delivery /run/lez-wallet/maker"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  maker-node:
    # The Maker's own Basecamp (headless; images/maker-node: the basecamp-ui
    # image plus the Maker Node): its desk starts the Maker's LEZ signer in
    # Basecamp's lez_core and has Basecamp's lez_swap_node launch and supervise
    # the Maker Node, the swap engine (node-entrypoint.sh, restarted when it
    # exits; its output is this container's log). `docker restart|stop|logs
    # lez-maker-node` act on the Maker's Basecamp and so on its Node.
    build:
      context: ./images/maker-node
      additional_contexts:
        basecamp: service:basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-maker-node:${LEZ_IMAGE_TAG:-local}
    container_name: lez-maker-node
    depends_on:
      maker-init:
        condition: service_completed_successfully
      sequencer:
        condition: service_healthy
      bitcoin-core:
        condition: service_healthy
      indexer:
        condition: service_healthy
    environment:
      BASECAMP_ROLE: maker
      # The UI Basecamp's maker desk runs this role's Chat and is the one people
      # look at: this desk neither chats nor refreshes the market.
      LEZ_DESK_CHAT: "0"
      LEZ_DESK_VIEW: "0"
      # The desk's signer (lez_role_signer.h) and Node (lez_role_node.h).
      LEZ_WALLET_DIR: /tmp/lez-wallet
      LEZ_WALLET_SEQUENCER_URL: http://sequencer:3040
      LEZ_MAKER_SIGNER_SOCKET: /run/lez-wallet/maker/signer.sock
      LEZ_MAKER_SIGNER_IDENTITY: /run-lez-identity/maker
      LEZ_MAKER_NODE_LAUNCHER: /usr/local/bin/node-entrypoint.sh
      LEZ_MAKER_NODE_LOG: /proc/1/fd/1
      LEZ_MAKER_NODE_HOLD: /tmp/lez-node-hold
      LEZ_MAKER_RPC_SOCKET: /run/lez/maker/node.sock
      # The Node: the LEZ wallet module signs this role's LEZ transactions
      # (Basecamp's lez_core, served by the desk above).
      LEZ_WALLET_SIGNER_SOCKET: /run/lez-wallet/maker/signer.sock
      LEZ_SIDECAR_PORT_BASE: "19000"
      LEZ_SEQUENCER_URL: http://127.0.0.1:3040
      LEZ_INDEXER_URL: http://127.0.0.1:8779
      LEZ_V02_CHANNEL_ID: ${LEZ_V02_CHANNEL_ID}
      LEZ_BTC_WALLET: lez-maker
      # Claims pay this role's own wallet, so the desk's balance shows them.
      LEZ_BTC_CLAIM_DESTINATION: ${LEZ_BTC_CLAIM_DESTINATION:-wallet}
      # Recovery timing profile (gen-config.sh renders it from LEZ_TIMING_PROFILE).
      LEZ_BTC_REFUND_CSV_BLOCKS: ${LEZ_BTC_REFUND_CSV_BLOCKS:-60}
      LEZ_BTC_SECOND_LOCK_REFUND_CSV_BLOCKS: ${LEZ_BTC_SECOND_LOCK_REFUND_CSV_BLOCKS:-33}
      LEZ_BTC_BLOCK_SECONDS_FASTEST: ${LEZ_BTC_BLOCK_SECONDS_FASTEST:-120}
      LEZ_BTC_BLOCK_SECONDS_SLOWEST: ${LEZ_BTC_BLOCK_SECONDS_SLOWEST:-120}
      LEZ_BTC_MAKER_LOCK_CUTOFF_SECONDS: ${LEZ_BTC_MAKER_LOCK_CUTOFF_SECONDS:-1800}
      LEZ_BTC_EARLIER_REFUND_SECONDS: ${LEZ_BTC_EARLIER_REFUND_SECONDS:-3600}
      LEZ_BTC_LATER_REFUND_SECONDS: ${LEZ_BTC_LATER_REFUND_SECONDS:-7200}
      LEZ_BTC_REFUND_MARGIN_SECONDS: ${LEZ_BTC_REFUND_MARGIN_SECONDS:-300}
      LEZ_BTC_LOCK_FEE_CONFIRMATION_TARGET: ${LEZ_BTC_LOCK_FEE_CONFIRMATION_TARGET:-6}
      LEZ_BTC_LOCK_FEE_FALLBACK_SAT_PER_VB: ${LEZ_BTC_LOCK_FEE_FALLBACK_SAT_PER_VB:-20}
      LEZ_BTC_LOCK_FEE_MAX_SAT_PER_VB: ${LEZ_BTC_LOCK_FEE_MAX_SAT_PER_VB:-25}
      LEZ_BTC_LOCK_FEE_MAX_PERCENT: ${LEZ_BTC_LOCK_FEE_MAX_PERCENT:-5}
      LEZ_LEZ_DISCOVERY_MAX_BLOCKS: ${LEZ_LEZ_DISCOVERY_MAX_BLOCKS:-2048}
      # Actor decision trace on stderr (`docker logs`); empty = off.
      LEZ_BTC_ACTOR_TRACE: ${LEZ_BTC_ACTOR_TRACE:-}
    volumes:
      - maker_state:/var/lib/lez/maker
      - maker_socket:/run/lez/maker
      # The Maker half of the prepared ZEC corridor (scripts/zec-provision.sh).
      - zec_maker:/var/lib/lez/zec
      - delivery_dir:/delivery
      # The identity's public half; the key stays with Basecamp's wallet.
      - ./runtime/lez/maker/identity.json:/run-lez-identity/identity.json:ro
      # The whole identity for the desk's signer only (the key stays in Basecamp).
      - ./runtime/lez/maker:/run-lez-identity/maker:ro
      - maker_wallet:/run/lez-wallet/maker
      - ./runtime/secrets/btc-rpc-cookie:/run-config/btc-rpc-cookie:ro
      - ./runtime/market-bootstrap.env:/run-market/market-bootstrap.env:ro
    networks: [chains]
    user: "4713:4713"
    # the host user's group: reads the role keys under runtime/lez (gen-config.sh)
    group_add: ["${LEZ_HOST_GID:-1000}"]
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "uds", "/run/lez/maker/node.sock", "maker_health", "[{}]"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 180s
      start_interval: 2s
    restart: unless-stopped
    logging: *default-logging

  taker-init:
    image: debian:bookworm-slim
    container_name: lez-taker-init
    user: "0:0"
    volumes:
      - taker_state:/var/lib/lez/taker
      - taker_socket:/run/lez/taker
      - zec_taker:/var/lib/lez/zec
      - taker_wallet:/run/lez-wallet/taker
    command: ["bash", "-c", "chown 4713:4713 /var/lib/lez/taker /run/lez/taker /var/lib/lez/zec /run/lez-wallet/taker && chmod 0700 /var/lib/lez/taker /run/lez/taker /var/lib/lez/zec /run/lez-wallet/taker"]
    networks: [chains]
    restart: "no"
    logging: *default-logging

  taker-node:
    # The Taker's own Basecamp (headless; images/taker-node: the basecamp-ui
    # image plus the Taker Node): its desk starts the Taker's LEZ signer in
    # Basecamp's lez_core and has Basecamp's lez_swap_node launch and supervise
    # the Taker Node, the swap engine (node-entrypoint.sh, restarted when it
    # exits; its output is this container's log). `docker restart|stop|logs
    # lez-taker-node` act on the Taker's Basecamp and so on its Node.
    build:
      context: ./images/taker-node
      additional_contexts:
        basecamp: service:basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-taker-node:${LEZ_IMAGE_TAG:-local}
    container_name: lez-taker-node
    depends_on:
      taker-init:
        condition: service_completed_successfully
      sequencer:
        condition: service_healthy
      maker-node:
        condition: service_healthy
    environment:
      BASECAMP_ROLE: taker
      # The UI Basecamp's taker desk runs this role's Chat and is the one people
      # look at: this desk neither chats nor refreshes the market.
      LEZ_DESK_CHAT: "0"
      LEZ_DESK_VIEW: "0"
      # The desk's signer (lez_role_signer.h) and Node (lez_role_node.h).
      LEZ_WALLET_DIR: /tmp/lez-wallet
      LEZ_WALLET_SEQUENCER_URL: http://sequencer:3040
      LEZ_TAKER_SIGNER_SOCKET: /run/lez-wallet/taker/signer.sock
      LEZ_TAKER_SIGNER_IDENTITY: /run-lez-identity/taker
      LEZ_TAKER_NODE_LAUNCHER: /usr/local/bin/node-entrypoint.sh
      LEZ_TAKER_NODE_LOG: /proc/1/fd/1
      LEZ_TAKER_NODE_HOLD: /tmp/lez-node-hold
      LEZ_TAKER_RPC_SOCKET: /run/lez/taker/node.sock
      # The Node: the LEZ wallet module signs this role's LEZ transactions
      # (Basecamp's lez_core, served by the desk above).
      LEZ_WALLET_SIGNER_SOCKET: /run/lez-wallet/taker/signer.sock
      LEZ_SIDECAR_PORT_BASE: "19500"
      LEZ_SEQUENCER_URL: http://127.0.0.1:3040
      LEZ_INDEXER_URL: http://127.0.0.1:8779
      LEZ_V02_CHANNEL_ID: ${LEZ_V02_CHANNEL_ID}
      # Empty = no node wallet: the owner signs the lock elsewhere (docs/api).
      LEZ_BTC_WALLET: ${LEZ_TAKER_BTC_WALLET-lez-taker}
      # Claims pay this role's own wallet, so the desk's balance shows them.
      LEZ_BTC_CLAIM_DESTINATION: ${LEZ_BTC_CLAIM_DESTINATION:-wallet}
      # Recovery timing profile (gen-config.sh renders it from LEZ_TIMING_PROFILE).
      LEZ_BTC_REFUND_CSV_BLOCKS: ${LEZ_BTC_REFUND_CSV_BLOCKS:-60}
      LEZ_BTC_SECOND_LOCK_REFUND_CSV_BLOCKS: ${LEZ_BTC_SECOND_LOCK_REFUND_CSV_BLOCKS:-33}
      LEZ_BTC_BLOCK_SECONDS_FASTEST: ${LEZ_BTC_BLOCK_SECONDS_FASTEST:-120}
      LEZ_BTC_BLOCK_SECONDS_SLOWEST: ${LEZ_BTC_BLOCK_SECONDS_SLOWEST:-120}
      LEZ_BTC_MAKER_LOCK_CUTOFF_SECONDS: ${LEZ_BTC_MAKER_LOCK_CUTOFF_SECONDS:-1800}
      LEZ_BTC_EARLIER_REFUND_SECONDS: ${LEZ_BTC_EARLIER_REFUND_SECONDS:-3600}
      LEZ_BTC_LATER_REFUND_SECONDS: ${LEZ_BTC_LATER_REFUND_SECONDS:-7200}
      LEZ_BTC_REFUND_MARGIN_SECONDS: ${LEZ_BTC_REFUND_MARGIN_SECONDS:-300}
      LEZ_BTC_LOCK_FEE_CONFIRMATION_TARGET: ${LEZ_BTC_LOCK_FEE_CONFIRMATION_TARGET:-6}
      LEZ_BTC_LOCK_FEE_FALLBACK_SAT_PER_VB: ${LEZ_BTC_LOCK_FEE_FALLBACK_SAT_PER_VB:-20}
      LEZ_BTC_LOCK_FEE_MAX_SAT_PER_VB: ${LEZ_BTC_LOCK_FEE_MAX_SAT_PER_VB:-25}
      LEZ_BTC_LOCK_FEE_MAX_PERCENT: ${LEZ_BTC_LOCK_FEE_MAX_PERCENT:-5}
      LEZ_LEZ_DISCOVERY_MAX_BLOCKS: ${LEZ_LEZ_DISCOVERY_MAX_BLOCKS:-2048}
      # Actor decision trace on stderr (`docker logs`); empty = off.
      LEZ_BTC_ACTOR_TRACE: ${LEZ_BTC_ACTOR_TRACE:-}
    volumes:
      - taker_state:/var/lib/lez/taker
      - taker_socket:/run/lez/taker
      # The Taker half of the prepared ZEC corridor plus its catalog.
      - zec_taker:/var/lib/lez/zec
      - delivery_dir:/delivery:ro
      - maker_socket:/run/lez/maker
      # The identity's public half; the key stays with Basecamp's wallet.
      - ./runtime/lez/taker/identity.json:/run-lez-identity/identity.json:ro
      # The whole identity for the desk's signer only (the key stays in Basecamp).
      - ./runtime/lez/taker:/run-lez-identity/taker:ro
      - taker_wallet:/run/lez-wallet/taker
      - ./runtime/secrets/btc-rpc-cookie:/run-config/btc-rpc-cookie:ro
      - ./runtime/market-bootstrap.env:/run-market/market-bootstrap.env:ro
    networks: [chains]
    user: "4713:4713"
    # the host user's group: reads the role keys under runtime/lez (gen-config.sh)
    group_add: ["${LEZ_HOST_GID:-1000}"]
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "uds", "/run/lez/taker/node.sock", "taker_health", "[{\"schema_version\":1}]"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 180s
      start_interval: 2s
    restart: unless-stopped
    logging: *default-logging

  basecamp-ui:
    build: ./images/basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-basecamp-ui:${LEZ_IMAGE_TAG:-local}
    container_name: lez-basecamp-ui
    # The desks people use (VNC, the UI tests): both roles' desks in one
    # Basecamp, talking to the Nodes that the roles' own Basecamps run.
    depends_on:
      maker-node:
        condition: service_healthy
      taker-node:
        condition: service_healthy
    environment:
      BASECAMP_ROLE: ${BASECAMP_ROLE:-both}
      VNC_PASSWORD: ${VNC_PASSWORD:-lezswap}
      LEZ_MAKER_RPC_SOCKET: /run/lez/maker/node.sock
      LEZ_TAKER_RPC_SOCKET: /run/lez/taker/node.sock
      M3_UI_DIRECTION: ${M3_UI_DIRECTION:-TakerSellsForeign}
    volumes:
      - maker_socket:/run/lez/maker:ro
      - taker_socket:/run/lez/taker:ro
      - ./ui-tests:/ui-tests:ro
    ports:
      - "127.0.0.1:5901:5900"
    networks: [chains]
    user: "4713:4713"
    init: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ─── one-shot tools (profile "tools", never a running service) ──────────
  # `docker compose --profile tools run --rm tools '<command>'`: the escrow
  # deployer and the vault claims of the one-time market bootstrap (through the
  # LEZ wallet module, lez-wallet-vault-claim), and the identity tool that mints
  # the wallet identities, all in the wallet-module image. Runs as the host user
  # so the market root stays the user's; loopback forwarders inside the
  # container reach sequencer/indexer, whose tools accept only 127.0.0.1.
  tools:
    build: ./images/lez-wallet-module
    image: ${LEZ_IMAGE_PREFIX:-lez}-wallet-module:${LEZ_IMAGE_TAG:-local}
    profiles: [tools]
    entrypoint: ["/bin/bash", "-c"]
    user: "${LEZ_HOST_UID:-1000}:${LEZ_HOST_GID:-1000}"
    environment:
      MARKET_ROOT: /market
      SEQUENCER_URL: http://127.0.0.1:3040
      INDEXER_URL: http://127.0.0.1:8779
      ESCROW_PROGRAM_ID: ${LEZ_ESCROW_PROGRAM_ID:-}
      DEPLOYER: /usr/local/bin/lez-zec-escrow-v02-deployer
      VAULT_CLAIM_BIN: /usr/local/bin/lez-wallet-vault-claim
      # The genesis allocations, from runtime.env (gen-config.sh); the bootstrap
      # refuses to claim without them.
      LEZ_WALLET_MAKER_ALLOCATION: ${LEZ_WALLET_MAKER_ALLOCATION:-}
      LEZ_WALLET_TAKER_ALLOCATION: ${LEZ_WALLET_TAKER_ALLOCATION:-}
      LEZ_HEARTBEAT_ALLOCATION: ${LEZ_HEARTBEAT_ALLOCATION:-0}
    volumes:
      - ${LEZ_MARKET_ROOT}:/market
      - ./scripts:/scripts:ro
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    restart: "no"
    logging: *default-logging

  # The LEZ finality heartbeat (Part C): one authenticated transfer of one unit
  # from heartbeat-pulse-01 to heartbeat-echo-02 every LEZ_HEARTBEAT_SECONDS,
  # the sequencer tip and the finalized height on every tick, and a stall
  # declared (one loud line + runtime/heartbeat/status.json) when finality is
  # flat for LEZ_HEARTBEAT_STALL_SECONDS while the tip moves. up.sh starts it
  # when LEZ_HEARTBEAT_SECONDS is not 0. The transfers go through the LEZ wallet
  # as a Logos module (lez_core in a headless logoscore, the sender's key
  # imported from the market root, mounted read-only).
  heartbeat:
    build: ./images/lez-wallet-module
    image: ${LEZ_IMAGE_PREFIX:-lez}-wallet-module:${LEZ_IMAGE_TAG:-local}
    container_name: lez-heartbeat
    profiles: [heartbeat]
    user: "${LEZ_HOST_UID:-1000}:${LEZ_HOST_GID:-1000}"
    environment:
      LEZ_HEARTBEAT_SECONDS: ${LEZ_HEARTBEAT_SECONDS:-20}
      LEZ_HEARTBEAT_STALL_SECONDS: ${LEZ_HEARTBEAT_STALL_SECONDS:-60}
    volumes:
      - ${LEZ_MARKET_ROOT}/identities:/market/identities:ro
      - ./runtime/market-bootstrap.env:/run-market/market-bootstrap.env:ro
      - ./runtime/heartbeat:/heartbeat
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      sequencer:
        condition: service_healthy
      indexer:
        condition: service_healthy
    logging: *default-logging
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        program="$$(sed -n 's/^M3_POC_LEZ_AUTH_TRANSFER_PROGRAM_ID=//p' /run-market/market-bootstrap.env | head -1)"
        recipient="$$(jq -r '.account_id_hex' /market/identities/heartbeat-echo-02/identity.json | tr 'A-F' 'a-f')"
        exec lez-wallet-heartbeat --sequencer-url http://sequencer:3040 --indexer-url http://indexer:8779 \
          --private-key-file /market/identities/heartbeat-pulse-01/lez-signer.key \
          --recipient-account-id "$$recipient" --authenticated-transfer-program-id "$$program" \
          --interval-seconds "$$LEZ_HEARTBEAT_SECONDS" --stall-seconds "$$LEZ_HEARTBEAT_STALL_SECONDS" \
          --status-file /heartbeat/status.json

networks:
  chains:
    name: lez-swap-chains
    driver: bridge

volumes:
  bitcoin_core_data:
    name: ${LEZ_VOLUME_PREFIX:-lez}-bitcoin-core-data
  zebra_data:
    name: ${LEZ_VOLUME_PREFIX:-lez}-zebra-data
  maker_state:
    name: ${LEZ_VOLUME_PREFIX:-lez}-maker-state
  maker_socket:
    name: ${LEZ_VOLUME_PREFIX:-lez}-maker-socket
  taker_state:
    name: ${LEZ_VOLUME_PREFIX:-lez}-taker-state
  taker_socket:
    name: ${LEZ_VOLUME_PREFIX:-lez}-taker-socket
  zec_maker:
    name: ${LEZ_VOLUME_PREFIX:-lez}-zec-maker
  zec_taker:
    name: ${LEZ_VOLUME_PREFIX:-lez}-zec-taker
  delivery_dir:
    name: ${LEZ_VOLUME_PREFIX:-lez}-delivery-dir
  maker_wallet:
    name: ${LEZ_VOLUME_PREFIX:-lez}-maker-wallet
  taker_wallet:
    name: ${LEZ_VOLUME_PREFIX:-lez}-taker-wallet
