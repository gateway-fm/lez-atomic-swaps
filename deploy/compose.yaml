# The stack's names derive from LEZ_STACK_PREFIX (scripts/lane.sh): unset, they
# are lez-swap-stack, lez-network, lez-sequencer, lez-heartbeat, the explorers,
# the network lez-swap-chains and the ports below; a second stack on the same
# host (deploy/README.md) takes another prefix and LEZ_STACK_PORT_OFFSET, and
# lane.sh exports the ports it gives.
name: ${LEZ_STACK_PREFIX:-lez}-swap-stack

# Images are named ${LEZ_IMAGE_PREFIX}-<service>:${LEZ_IMAGE_TAG}. The default
# (lez-<service>:local) is what `docker compose build` produces on this host;
# a release sets the prefix to the registry path and the tag to the release
# (ghcr.io/gateway-fm/lez-atomic-swaps/lez-maker-node:v0.2.1) so the same
# file runs prebuilt images (scripts/start.sh) or locally built ones (up.sh).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# A role's Basecamp also carries Logos Delivery's log, which prints every offer
# it relays as a byte array: ~12 MB a minute with three lanes publishing. The
# tests read the Node's own lines from this log (node-e2e.py), so it must reach
# back over a whole swap; 30 MB did not (two minutes).
x-role-logging: &role-logging
  driver: json-file
  options:
    max-size: "200m"
    max-file: "3"

# A lane (scripts/lane.sh, compose.lane.yaml) is one more Maker/Taker pair with
# its own Bitcoin Core, miner and Zebra beside the one LEZ network: the
# LEZ_CONTAINER_PREFIX, LEZ_LANE_RUNTIME, LEZ_ZEBRA_PORT and VNC port variables
# below name its containers, files and ports. Unset, they are lane 1: this stack.
# Container names fall back to the stack's prefix, volume names to the stack's
# volume prefix (gen-config.sh records it in runtime.env).

services:
  # ─── Bitcoin regtest ────────────────────────────────────────────────────
  # The data volume takes its owner (65532) from the image's /var/lib/bitcoin
  # the first time it is mounted, so no init container chowns it.
  bitcoin-core:
    build: ./images/bitcoin-core
    image: ${LEZ_IMAGE_PREFIX:-lez}-bitcoin-core:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_CONTAINER_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-bitcoin-core
    command:
      - "-conf=/run-config/bitcoin.conf"
      - "-datadir=/var/lib/bitcoin"
      - "-printtoconsole"
    environment:
      HOME: /tmp
    labels:
      org.logos-co.atomic-swaps.run: market-btc-0001
      org.logos-co.atomic-swaps.scope: bitcoin-core-regtest-e2e
      org.logos-co.atomic-swaps.component: bitcoin-core
    ports:
      - "127.0.0.1:${LEZ_BTC_RPC_PORT:-18443}:18443"
    volumes:
      - ./runtime/btc/bitcoin.conf:/run-config/bitcoin.conf:ro
      - bitcoin_core_data:/var/lib/bitcoin
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/bitcoin-cli", "-conf=/run-config/bitcoin.conf", "-datadir=/var/lib/bitcoin", "-rpcwait", "getblockchaininfo"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 180s
    networks: [chains]
    user: "65532:65532"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    restart: unless-stopped
    logging: *default-logging

  # Zcash Regtest for the LEZ <-> ZEC pair, alongside bitcoin-core for BTC.
  # Same digest-pinned upstream build as the isolated lane in tests/e2e/zebra.
  # Its data volume takes its owner (65532) from the image's /var/lib/zebra.
  zebra:
    build: ./images/zebra
    image: ${LEZ_IMAGE_PREFIX:-lez}-zebra:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_CONTAINER_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-zebra
    command:
      - "--config"
      - "/run-config/zebrad.toml"
      - "start"
    environment:
      HOME: /tmp
      ZEBRA_RPC__COOKIE_DIR: /tmp
    labels:
      org.logos-co.atomic-swaps.run: market-zec-0001
      org.logos-co.atomic-swaps.scope: zebra-regtest-e2e
      org.logos-co.atomic-swaps.component: zebra
    ports:
      - "127.0.0.1:${LEZ_ZEBRA_PORT:-18232}:18232"
    volumes:
      # Rendered by scripts/gen-config.sh from assets/zebra/zebrad.toml: the
      # miner_address is the Maker's minted Zcash key (runtime/lez/maker/zcash.key).
      - ./${LEZ_LANE_RUNTIME:-runtime}/zebra/zebrad.toml:/run-config/zebrad.toml:ro
      - zebra_data:/var/lib/zebra
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "tcp", "127.0.0.1:18232", "getblockchaininfo", "[]"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 180s
    networks: [chains]
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s

  btc-miner:
    build: ./images/btc-miner
    image: ${LEZ_IMAGE_PREFIX:-lez}-btc-miner:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_CONTAINER_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-btc-miner
    depends_on:
      bitcoin-core:
        condition: service_healthy
    volumes:
      - ./runtime/btc/bitcoin.conf:/run-config/bitcoin.conf:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/btc-miner.sh"]
    environment:
      BTC_CONF: /run-config/bitcoin.conf
      BTC_RPC_HOST: bitcoin-core
      MINE_INTERVAL: "${MINE_INTERVAL:-120}"
    networks: [chains]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # The block explorers (profile "explorers", off by default): up.sh starts
  # them with LEZ_EXPLORERS=1, verify-all.sh for its explorer checks.
  btc-explorer:
    build: ./images/btc-explorer
    image: ${LEZ_IMAGE_PREFIX:-lez}-btc-explorer:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_STACK_PREFIX:-lez}-btc-explorer
    profiles: [explorers]
    depends_on:
      bitcoin-core:
        condition: service_healthy
    environment:
      BTCEXP_BITCOIND_URI: http://lezrpc:${BTC_RPC_PASSWORD:?run scripts/up.sh first}@bitcoin-core:18443
      BTCEXP_ADDRESS_API: none
    ports:
      - "127.0.0.1:${LEZ_BTC_EXPLORER_PORT:-3002}:3002"
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ─── LEZ v0.2 devnet ────────────────────────────────────────────────────
  # The LEZ v0.2 network in one Basecamp (images/lez-network-module): its LEZ
  # Network desk starts the two Logos modules a Basecamp user installs.
  # - blockchain_module 0.2.4 (node 0.2.4), the devnet's block producer, with
  #   the bedrock config and deployment files: its HTTP API on :18080 (alias
  #   bedrock, the sequencer's and the indexer's node), its state under
  #   runtime/bedrock;
  # - lez_indexer_module (1.1.1 source on LEZ v0.2.4, plus serve_rpc in
  #   builder/patches/lez-indexer-module), serving indexer_service's own
  #   JSON-RPC on :8779 (alias indexer), so the Nodes, the sidecars and the
  #   probes read it as before. The Basecamp user directory, the indexer's
  #   database in it, is runtime/indexer.
  # The desk's Re-index rebuilds the indexer's database while the node keeps
  # running (scripts/repair-indexer.sh). The services run as the host user, so
  # their state under runtime/ is the host user's (no init container chowns it).
  network:
    build:
      context: ./images/lez-network-module
      additional_contexts:
        basecamp: service:basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-network-module:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_STACK_PREFIX:-lez}-network
    environment:
      HOME: /tmp
      POL_PROOF_DEV_MODE: "true"
      LEZ_NETWORK_NODE_CONFIG: /opt/lez-v0.2-source/bedrock/node-config.yaml
      LEZ_NETWORK_NODE_DEPLOYMENT: /run-config/deployment-settings.yaml
      LEZ_INDEXER_CONFIG: /run-config/indexer_config.json
      LEZ_INDEXER_RPC_PORT: "8779"
    labels:
      org.logos-co.atomic-swaps.run: market-lez-0001
      org.logos-co.atomic-swaps.scope: lez-v0.2-local-devnet
      org.logos-co.atomic-swaps.component: lez-network
    ports:
      - "127.0.0.1:${LEZ_INDEXER_PORT:-8779}:8779"
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-network-health", "18080", "8779"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 180s
      start_interval: 2s
    working_dir: /work
    volumes:
      - ./assets/lez-source/bedrock:/opt/lez-v0.2-source/bedrock:ro
      - ./assets/lez-source/bedrock/kzgrs_test_params:/kzgrs_test_params:ro
      - ./runtime/config/deployment-settings.yaml:/run-config/deployment-settings.yaml:ro
      - ./runtime/config/indexer_config.json:/run-config/indexer_config.json:ro
      - ./runtime/bedrock:/work/state
      - ./runtime/indexer:/work/basecamp
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks:
      chains:
        aliases: [bedrock, indexer]
    user: "${LEZ_HOST_UID:-1000}:${LEZ_HOST_GID:-1000}"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 1024
    # the node's 2 CPUs / 4 GB and the indexer's 2 CPUs / 2 GB
    cpus: 4.0
    mem_limit: 6g
    # The LEZ processes shut down cleanly on Ctrl-C only and ignore SIGTERM, so
    # a default stop waits out the grace period and kills them mid-write.
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  sequencer:
    build: ./images/lez-services
    image: ${LEZ_IMAGE_PREFIX:-lez}-services:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_STACK_PREFIX:-lez}-sequencer
    entrypoint: ["/usr/local/bin/sequencer_service"]
    command: ["/run-config/sequencer_config.json", "--port", "3040"]
    environment:
      HOME: /tmp
      RUST_LOG: info
      RISC0_SERVER_PATH: /usr/local/bin/r0vm
    labels:
      org.logos-co.atomic-swaps.run: market-lez-0001
      org.logos-co.atomic-swaps.scope: lez-v0.2-local-devnet
      org.logos-co.atomic-swaps.component: sequencer
    ports:
      - "127.0.0.1:${LEZ_SEQUENCER_PORT:-3040}:3040"
    depends_on:
      network:
        condition: service_healthy
    volumes:
      - ./runtime/config/sequencer_config.json:/run-config/sequencer_config.json:ro
      - ./runtime/sequencer:/var/lib/sequencer_service
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g,mode=1777
    networks: [chains]
    user: "${LEZ_HOST_UID:-1000}:${LEZ_HOST_GID:-1000}"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 1024
    cpus: 4.0
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "tcp", "127.0.0.1:3040", "getBlock", "[1]"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 180s
      start_interval: 2s
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  lez-explorer:
    build: ./images/lez-explorer
    image: ${LEZ_IMAGE_PREFIX:-lez}-explorer:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_STACK_PREFIX:-lez}-lez-explorer
    profiles: [explorers]
    depends_on:
      network:
        condition: service_healthy
    environment:
      LEZ_INDEXER_URL: http://indexer:8779
      M3_BTC_EVIDENCE_FILE: /run/lez-evidence/m3-btc-ui-evidence.json
      LEZ_EVIDENCE_DIR: /run/lez-evidence/swaps
    ports:
      - "127.0.0.1:${LEZ_LEZ_EXPLORER_PORT:-3003}:3003"
    volumes:
      - ./runtime/m3-btc-ui-evidence.json:/run/lez-evidence/m3-btc-ui-evidence.json:ro
      - ./runtime/evidence:/run/lez-evidence/swaps:ro
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging

  # ─── swap application ───────────────────────────────────────────────────
  maker-node:
    # The Maker's own Basecamp (images/maker-node: the basecamp-ui image with
    # the Maker's Node package, lez_maker_node, installed), on VNC at
    # 127.0.0.1:5901. Its Maker desk, opened when the container starts, is the
    # one the Maker uses and the UI tests drive (ui-tests/, mounted for them).
    # The desk starts the Maker's LEZ signer in Basecamp's lez_core and has
    # Basecamp's lez_swap_node launch and supervise the Maker Node, the swap
    # engine, from the package (its launcher, restarted when it exits; its
    # output is this container's log). `docker restart|stop|logs
    # lez-maker-node` act on the Maker's whole Basecamp: desk, signer and Node;
    # the Node alone is held down by the supervisor's hold file
    # (LEZ_MAKER_NODE_HOLD, scripts/node-hold.sh).
    # The image owns the state directories: a named volume takes the owner and
    # mode of the image directory it is first mounted on.
    build:
      context: ./images/maker-node
      additional_contexts:
        basecamp: service:basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-maker-node:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_CONTAINER_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-maker-node
    depends_on:
      sequencer:
        condition: service_healthy
      bitcoin-core:
        condition: service_healthy
      network:
        condition: service_healthy
    environment:
      BASECAMP_ROLE: maker
      VNC_PASSWORD: ${VNC_PASSWORD:-lezswap}
      # The desk's signer (lez_role_signer.h) and Node (lez_role_node.h).
      LEZ_WALLET_DIR: /tmp/lez-wallet
      LEZ_WALLET_SEQUENCER_URL: http://sequencer:3040
      LEZ_MAKER_SIGNER_SOCKET: /run/lez-wallet/maker/signer.sock
      LEZ_MAKER_SIGNER_IDENTITY: /run-lez-identity/maker
      # The Node's launcher from the installed lez_maker_node package.
      LEZ_MAKER_NODE_LAUNCHER: package
      LEZ_MAKER_NODE_LOG: /proc/1/fd/1
      LEZ_MAKER_NODE_HOLD: /tmp/lez-node-hold
      LEZ_MAKER_RPC_SOCKET: /run/lez/maker/node.sock
      # The Node: the LEZ wallet module signs this role's LEZ transactions
      # (Basecamp's lez_core, served by the desk above).
      LEZ_WALLET_SIGNER_SOCKET: /run/lez-wallet/maker/signer.sock
      LEZ_SIDECAR_PORT_BASE: "19000"
      LEZ_SEQUENCER_URL: http://127.0.0.1:3040
      LEZ_INDEXER_URL: http://127.0.0.1:8779
      LEZ_V02_CHANNEL_ID: ${LEZ_V02_CHANNEL_ID}
      LEZ_BTC_WALLET: lez-maker
      # Claims pay this role's own wallet, so the desk's balance shows them.
      LEZ_BTC_CLAIM_DESTINATION: ${LEZ_BTC_CLAIM_DESTINATION:-wallet}
      # Recovery timing profile (gen-config.sh renders it from LEZ_TIMING_PROFILE).
      LEZ_BTC_REFUND_CSV_BLOCKS: ${LEZ_BTC_REFUND_CSV_BLOCKS:-60}
      LEZ_BTC_SECOND_LOCK_REFUND_CSV_BLOCKS: ${LEZ_BTC_SECOND_LOCK_REFUND_CSV_BLOCKS:-33}
      LEZ_BTC_BLOCK_SECONDS_FASTEST: ${LEZ_BTC_BLOCK_SECONDS_FASTEST:-120}
      LEZ_BTC_BLOCK_SECONDS_SLOWEST: ${LEZ_BTC_BLOCK_SECONDS_SLOWEST:-120}
      LEZ_BTC_MAKER_LOCK_CUTOFF_SECONDS: ${LEZ_BTC_MAKER_LOCK_CUTOFF_SECONDS:-1800}
      LEZ_BTC_EARLIER_REFUND_SECONDS: ${LEZ_BTC_EARLIER_REFUND_SECONDS:-3600}
      LEZ_BTC_LATER_REFUND_SECONDS: ${LEZ_BTC_LATER_REFUND_SECONDS:-7200}
      LEZ_BTC_REFUND_MARGIN_SECONDS: ${LEZ_BTC_REFUND_MARGIN_SECONDS:-300}
      LEZ_BTC_LOCK_FEE_CONFIRMATION_TARGET: ${LEZ_BTC_LOCK_FEE_CONFIRMATION_TARGET:-6}
      LEZ_BTC_LOCK_FEE_FALLBACK_SAT_PER_VB: ${LEZ_BTC_LOCK_FEE_FALLBACK_SAT_PER_VB:-20}
      LEZ_BTC_LOCK_FEE_MAX_SAT_PER_VB: ${LEZ_BTC_LOCK_FEE_MAX_SAT_PER_VB:-25}
      LEZ_BTC_LOCK_FEE_MAX_PERCENT: ${LEZ_BTC_LOCK_FEE_MAX_PERCENT:-5}
      LEZ_LEZ_DISCOVERY_MAX_BLOCKS: ${LEZ_LEZ_DISCOVERY_MAX_BLOCKS:-2048}
      # The actor supervisor's polling (gen-config.sh, per timing profile);
      # empty = the Node's defaults (5 s requeue, 30 s failure backoff).
      LEZ_MAKER_ACTOR_REQUEUE_SECONDS: ${LEZ_MAKER_ACTOR_REQUEUE_SECONDS:-}
      # The Node's own lines, whole, for the tests that count them
      # (node-e2e.py); the container's output interleaves them with Delivery's.
      LEZ_NODE_LOG_FILE: /run/lez/maker/node.log
      LEZ_MAKER_ACTOR_FAILURE_BACKOFF_SECONDS: ${LEZ_MAKER_ACTOR_FAILURE_BACKOFF_SECONDS:-}
      # How long LEZ finality may stand still before maker_health reports
      # lez_finality_stalled (gen-config.sh: the heartbeat's threshold); empty
      # = the Node's default (600 s).
      LEZ_NODE_FINALITY_STALL_SECONDS: ${LEZ_NODE_FINALITY_STALL_SECONDS:-}
      # Actor decision trace on stderr (`docker logs`); empty = off.
      LEZ_BTC_ACTOR_TRACE: ${LEZ_BTC_ACTOR_TRACE:-}
    volumes:
      - maker_state:/var/lib/lez/maker
      # The Node's sockets; the Taker Node reaches the Maker's Chat socket here.
      - maker_socket:/run/lez/maker
      # The Maker half of the prepared ZEC corridor (scripts/zec-provision.sh).
      - zec_maker:/var/lib/lez/zec
      - delivery_dir:/delivery
      # The identity's public half; the key stays with Basecamp's wallet.
      - ./${LEZ_LANE_RUNTIME:-runtime}/lez/maker/identity.json:/run-lez-identity/identity.json:ro
      # The whole identity for the desk's signer only (the key stays in Basecamp).
      - ./${LEZ_LANE_RUNTIME:-runtime}/lez/maker:/run-lez-identity/maker:ro
      # The minted Zcash key, which is also the Maker's Delivery signing key
      # (node-entrypoint.sh installs it from here; zebra mines to it).
      - ./${LEZ_LANE_RUNTIME:-runtime}/lez/maker/zcash.key:/run-lez-identity/zcash.key:ro
      - maker_wallet:/run/lez-wallet/maker
      - ./runtime/secrets/btc-rpc-cookie:/run-config/btc-rpc-cookie:ro
      - ./runtime/market-bootstrap.env:/run-market/market-bootstrap.env:ro
      - ./ui-tests:/ui-tests:ro
    ports:
      - "127.0.0.1:${LEZ_MAKER_VNC_PORT:-5901}:5900"
    networks: [chains]
    user: "4713:4713"
    # the host user's group: reads the role keys under runtime/lez (gen-config.sh)
    group_add: ["${LEZ_HOST_GID:-1000}"]
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "uds", "/run/lez/maker/node.sock", "maker_health", "[{}]"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 180s
      start_interval: 2s
    restart: unless-stopped
    logging: *role-logging

  taker-node:
    # The Taker's own Basecamp (images/taker-node: the basecamp-ui image with
    # the Taker's Node package, lez_taker_node, installed), on VNC at
    # 127.0.0.1:5902: as maker-node, for the Taker.
    build:
      context: ./images/taker-node
      additional_contexts:
        basecamp: service:basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-taker-node:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_CONTAINER_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-taker-node
    depends_on:
      sequencer:
        condition: service_healthy
      maker-node:
        condition: service_healthy
    environment:
      BASECAMP_ROLE: taker
      VNC_PASSWORD: ${VNC_PASSWORD:-lezswap}
      # The desk's signer (lez_role_signer.h) and Node (lez_role_node.h).
      LEZ_WALLET_DIR: /tmp/lez-wallet
      LEZ_WALLET_SEQUENCER_URL: http://sequencer:3040
      LEZ_TAKER_SIGNER_SOCKET: /run/lez-wallet/taker/signer.sock
      LEZ_TAKER_SIGNER_IDENTITY: /run-lez-identity/taker
      # The Node's launcher from the installed lez_taker_node package.
      LEZ_TAKER_NODE_LAUNCHER: package
      LEZ_TAKER_NODE_LOG: /proc/1/fd/1
      LEZ_TAKER_NODE_HOLD: /tmp/lez-node-hold
      LEZ_TAKER_RPC_SOCKET: /run/lez/taker/node.sock
      # The Node: the LEZ wallet module signs this role's LEZ transactions
      # (Basecamp's lez_core, served by the desk above).
      LEZ_WALLET_SIGNER_SOCKET: /run/lez-wallet/taker/signer.sock
      LEZ_SIDECAR_PORT_BASE: "19500"
      LEZ_SEQUENCER_URL: http://127.0.0.1:3040
      LEZ_INDEXER_URL: http://127.0.0.1:8779
      LEZ_V02_CHANNEL_ID: ${LEZ_V02_CHANNEL_ID}
      # Empty = no node wallet: the owner signs the lock elsewhere (docs/api).
      LEZ_BTC_WALLET: ${LEZ_TAKER_BTC_WALLET-lez-taker}
      # Claims pay this role's own wallet, so the desk's balance shows them.
      LEZ_BTC_CLAIM_DESTINATION: ${LEZ_BTC_CLAIM_DESTINATION:-wallet}
      # Recovery timing profile (gen-config.sh renders it from LEZ_TIMING_PROFILE).
      LEZ_BTC_REFUND_CSV_BLOCKS: ${LEZ_BTC_REFUND_CSV_BLOCKS:-60}
      LEZ_BTC_SECOND_LOCK_REFUND_CSV_BLOCKS: ${LEZ_BTC_SECOND_LOCK_REFUND_CSV_BLOCKS:-33}
      LEZ_BTC_BLOCK_SECONDS_FASTEST: ${LEZ_BTC_BLOCK_SECONDS_FASTEST:-120}
      LEZ_BTC_BLOCK_SECONDS_SLOWEST: ${LEZ_BTC_BLOCK_SECONDS_SLOWEST:-120}
      LEZ_BTC_MAKER_LOCK_CUTOFF_SECONDS: ${LEZ_BTC_MAKER_LOCK_CUTOFF_SECONDS:-1800}
      LEZ_BTC_EARLIER_REFUND_SECONDS: ${LEZ_BTC_EARLIER_REFUND_SECONDS:-3600}
      LEZ_BTC_LATER_REFUND_SECONDS: ${LEZ_BTC_LATER_REFUND_SECONDS:-7200}
      LEZ_BTC_REFUND_MARGIN_SECONDS: ${LEZ_BTC_REFUND_MARGIN_SECONDS:-300}
      LEZ_BTC_LOCK_FEE_CONFIRMATION_TARGET: ${LEZ_BTC_LOCK_FEE_CONFIRMATION_TARGET:-6}
      LEZ_BTC_LOCK_FEE_FALLBACK_SAT_PER_VB: ${LEZ_BTC_LOCK_FEE_FALLBACK_SAT_PER_VB:-20}
      LEZ_BTC_LOCK_FEE_MAX_SAT_PER_VB: ${LEZ_BTC_LOCK_FEE_MAX_SAT_PER_VB:-25}
      LEZ_BTC_LOCK_FEE_MAX_PERCENT: ${LEZ_BTC_LOCK_FEE_MAX_PERCENT:-5}
      LEZ_LEZ_DISCOVERY_MAX_BLOCKS: ${LEZ_LEZ_DISCOVERY_MAX_BLOCKS:-2048}
      # The Bitcoin observer's pause between sweeps (gen-config.sh, per timing
      # profile); empty = the Node's default (15 s).
      LEZ_TAKER_OBSERVER_SWEEP_SECONDS: ${LEZ_TAKER_OBSERVER_SWEEP_SECONDS:-}
      # How long LEZ finality may stand still before taker_health reports
      # lez_finality_stalled (gen-config.sh); empty = the Node's default (600 s).
      LEZ_NODE_FINALITY_STALL_SECONDS: ${LEZ_NODE_FINALITY_STALL_SECONDS:-}
      # The Node's own lines, whole, for the tests that count them
      # (node-e2e.py); the container's output interleaves them with Delivery's.
      LEZ_NODE_LOG_FILE: /run/lez/taker/node.log
      # Actor decision trace on stderr (`docker logs`); empty = off.
      LEZ_BTC_ACTOR_TRACE: ${LEZ_BTC_ACTOR_TRACE:-}
    volumes:
      - taker_state:/var/lib/lez/taker
      # The Taker half of the prepared ZEC corridor plus its catalog.
      - zec_taker:/var/lib/lez/zec
      - delivery_dir:/delivery:ro
      # the Maker's Chat socket (the Node's own sockets stay in the image's /run/lez/taker)
      - maker_socket:/run/lez/maker
      # The identity's public half; the key stays with Basecamp's wallet.
      - ./${LEZ_LANE_RUNTIME:-runtime}/lez/taker/identity.json:/run-lez-identity/identity.json:ro
      # The whole identity for the desk's signer only (the key stays in Basecamp).
      - ./${LEZ_LANE_RUNTIME:-runtime}/lez/taker:/run-lez-identity/taker:ro
      - taker_wallet:/run/lez-wallet/taker
      - ./runtime/secrets/btc-rpc-cookie:/run-config/btc-rpc-cookie:ro
      - ./runtime/market-bootstrap.env:/run-market/market-bootstrap.env:ro
      - ./ui-tests:/ui-tests:ro
    ports:
      - "127.0.0.1:${LEZ_TAKER_VNC_PORT:-5902}:5900"
    networks: [chains]
    user: "4713:4713"
    # the host user's group: reads the role keys under runtime/lez (gen-config.sh)
    group_add: ["${LEZ_HOST_GID:-1000}"]
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/lez-runtime-healthcheck", "uds", "/run/lez/taker/node.sock", "taker_health", "[{\"schema_version\":1}]"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 180s
      start_interval: 2s
    restart: unless-stopped
    logging: *role-logging

  basecamp-ui:
    # Build only: the Basecamp image (Xvfb, VNC, the portable Basecamp, both
    # role packages, qt-mcp) the parties' Basecamps (maker-node, taker-node)
    # and the LEZ network's (network) are built on, through their
    # `basecamp` build context. It runs no container (scale 0): each party's
    # desk lives in that party's own Basecamp.
    build: ./images/basecamp-ui
    image: ${LEZ_IMAGE_PREFIX:-lez}-basecamp-ui:${LEZ_IMAGE_TAG:-local}
    scale: 0

  # ─── one-shot tools (profile "tools", never a running service) ──────────
  # `docker compose --profile tools run --rm tools '<command>'`: the escrow
  # deployer and the vault claims of the one-time market bootstrap (through the
  # LEZ wallet module, lez-wallet-vault-claim), and the identity tool that mints
  # the wallet identities, all in the wallet-module image. Runs as the host user
  # so the market root stays the user's; loopback forwarders inside the
  # container reach sequencer/indexer, whose tools accept only 127.0.0.1.
  tools:
    build: ./images/lez-wallet-module
    image: ${LEZ_IMAGE_PREFIX:-lez}-wallet-module:${LEZ_IMAGE_TAG:-local}
    profiles: [tools]
    entrypoint: ["/bin/bash", "-c"]
    user: "${LEZ_HOST_UID:-1000}:${LEZ_HOST_GID:-1000}"
    environment:
      MARKET_ROOT: /market
      SEQUENCER_URL: http://127.0.0.1:3040
      INDEXER_URL: http://127.0.0.1:8779
      ESCROW_PROGRAM_ID: ${LEZ_ESCROW_PROGRAM_ID:-}
      DEPLOYER: /usr/local/bin/lez-zec-escrow-v02-deployer
      VAULT_CLAIM_BIN: /usr/local/bin/lez-wallet-vault-claim
      # The genesis allocations, from runtime.env (gen-config.sh); the bootstrap
      # refuses to claim without them.
      LEZ_WALLET_MAKER_ALLOCATION: ${LEZ_WALLET_MAKER_ALLOCATION:-}
      LEZ_WALLET_TAKER_ALLOCATION: ${LEZ_WALLET_TAKER_ALLOCATION:-}
      LEZ_HEARTBEAT_ALLOCATION: ${LEZ_HEARTBEAT_ALLOCATION:-0}
    volumes:
      - ${LEZ_MARKET_ROOT}:/market
      - ./scripts:/scripts:ro
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    restart: "no"
    logging: *default-logging

  # The LEZ finality heartbeat (Part C): one authenticated transfer of one unit
  # from heartbeat-pulse-01 to heartbeat-echo-02 every LEZ_HEARTBEAT_SECONDS,
  # the sequencer tip and the finalized height on every tick, and a stall
  # declared (one loud line + runtime/heartbeat/status.json) when finality is
  # flat for LEZ_HEARTBEAT_STALL_SECONDS while the tip moves. up.sh starts it
  # when LEZ_HEARTBEAT_SECONDS is not 0. The transfers go through the LEZ wallet
  # as a Logos module (lez_core in a headless logoscore, the sender's key
  # imported from the market root, mounted read-only).
  heartbeat:
    build: ./images/lez-wallet-module
    image: ${LEZ_IMAGE_PREFIX:-lez}-wallet-module:${LEZ_IMAGE_TAG:-local}
    container_name: ${LEZ_STACK_PREFIX:-lez}-heartbeat
    profiles: [heartbeat]
    user: "${LEZ_HOST_UID:-1000}:${LEZ_HOST_GID:-1000}"
    environment:
      LEZ_HEARTBEAT_SECONDS: ${LEZ_HEARTBEAT_SECONDS:-20}
      LEZ_HEARTBEAT_STALL_SECONDS: ${LEZ_HEARTBEAT_STALL_SECONDS:-60}
    volumes:
      - ${LEZ_MARKET_ROOT}/identities:/market/identities:ro
      - ./runtime/market-bootstrap.env:/run-market/market-bootstrap.env:ro
      - ./runtime/heartbeat:/heartbeat
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    networks: [chains]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      sequencer:
        condition: service_healthy
      network:
        condition: service_healthy
    logging: *default-logging
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        program="$$(sed -n 's/^M3_POC_LEZ_AUTH_TRANSFER_PROGRAM_ID=//p' /run-market/market-bootstrap.env | head -1)"
        recipient="$$(jq -r '.account_id_hex' /market/identities/heartbeat-echo-02/identity.json | tr 'A-F' 'a-f')"
        exec lez-wallet-heartbeat --sequencer-url http://sequencer:3040 --indexer-url http://indexer:8779 \
          --private-key-file /market/identities/heartbeat-pulse-01/lez-signer.key \
          --recipient-account-id "$$recipient" --authenticated-transfer-program-id "$$program" \
          --interval-seconds "$$LEZ_HEARTBEAT_SECONDS" --stall-seconds "$$LEZ_HEARTBEAT_STALL_SECONDS" \
          --status-file /heartbeat/status.json

networks:
  chains:
    name: ${LEZ_STACK_PREFIX:-lez}-swap-chains
    driver: bridge

volumes:
  bitcoin_core_data:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-bitcoin-core-data
  zebra_data:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-zebra-data
  maker_state:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-maker-state
  maker_socket:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-maker-socket
  taker_state:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-taker-state
  zec_maker:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-zec-maker
  zec_taker:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-zec-taker
  delivery_dir:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-delivery-dir
  maker_wallet:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-maker-wallet
  taker_wallet:
    name: ${LEZ_VOLUME_PREFIX:-${LEZ_STACK_PREFIX:-lez}}-taker-wallet
