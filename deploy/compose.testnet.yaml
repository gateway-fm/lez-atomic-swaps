# compose.testnet.yaml — the Maker's and the Taker's Basecamps (each party's
# desk and Node) on public networks: the official LEZ v0.2 testnet and Bitcoin
# testnet4. Their desks are on VNC at 127.0.0.1:5903 (Maker) and :5904 (Taker),
# beside a local stack's 5901/5902.
#
#   docker compose -p lez-testnet -f compose.yaml -f compose.testnet.yaml \
#     up -d maker-node taker-node
#
# Nothing here is a chain: the Nodes reach the official LEZ sequencer
# https://testnet.lez.logos.co/ directly over HTTPS (the official_public
# sequencer route: the Node, its per-swap sidecars and the role's signer
# wallet; no proxy), and services on the external Docker network
# `lez-testnet`, each run next to this stack (docs/testnet-run.md):
#   lez-btc-testnet4       Bitcoin Core 31.1 on testnet4 (txindex, txospenderindex, RPC 18443)
#   lez-testnet-indexer    LEZ v0.2.4 indexer on :8779, following the public chain
#   lez-testnet-node       Logos Blockchain node on the public testnet (feeds the indexer)
# Bitcoin Core and the indexer keep their literal-loopback endpoints; the
# launcher forwards 127.0.0.1:18443/8779 to these names.

x-testnet-node-env: &testnet-node-env
  LEZ_BTC_NETWORK: testnet4
  LEZ_LEZ_NETWORK: testnet
  LEZ_BITCOIN_CORE_HOST: lez-btc-testnet4
  LEZ_INDEXER_HOST: lez-testnet-indexer
  # The official sequencer, straight (modules/lez-role-node/node-entrypoint.sh
  # renders the route into the Node's configuration and the sidecars' profile).
  LEZ_LEZ_SEQUENCER_ROUTE: official_public
  LEZ_SEQUENCER_URL: https://testnet.lez.logos.co/
  # The role's Basecamp hosts the role's signer (lez_core) beside its Node; its
  # wallet's sequencer client speaks HTTPS (rustls, the platform verifier).
  LEZ_WALLET_SEQUENCER_URL: https://testnet.lez.logos.co/
  LEZ_V02_CHANNEL_ID: "0101010101010101010101010101010101010101010101010101010101010101"

services:
  maker-node:
    container_name: lez-testnet-maker-node
    depends_on: !reset {}
    environment:
      <<: *testnet-node-env
    ports: !override
      - "127.0.0.1:5903:5900"
    networks: !override [testnet]

  taker-node:
    container_name: lez-testnet-taker-node
    # Not the local sequencer: on this route the chain is the public one.
    depends_on: !override
      maker-node:
        condition: service_healthy
    environment:
      <<: *testnet-node-env
    ports: !override
      - "127.0.0.1:5904:5900"
    networks: !override [testnet]

networks:
  testnet:
    name: lez-testnet
    external: true
