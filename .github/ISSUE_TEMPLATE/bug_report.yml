name: Bug report
description: Report a reproducible non-security defect
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not disclose vulnerabilities or secrets here. Use the repository's
        private vulnerability reporting channel described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Exact commit or release tag used
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal local-only reproduction steps and sanitized output
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no secret, private evidence, or uncoordinated vulnerability detail.
          required: true
