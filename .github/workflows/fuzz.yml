name: fuzz

# A short bounded run of each cargo-fuzz target from the checked-in seeds. It needs a pinned
# nightly, so it runs on a schedule and on demand, never on a pull request or as a required
# check; the stable corpus replay tests in ci.yml are the per-change gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [coordinator, offer_announcement, chat_frame, zec_agreement_wire]
    env:
      FUZZ_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the target for 120 seconds in the pinned container
        run: ./scripts/run-fuzz.sh "${{ matrix.target }}" 120 "${RUNNER_TEMP}/fuzz-${{ matrix.target }}"
      - name: Keep the crash artifacts and log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fuzz-${{ matrix.target }}/artifacts
            ${{ runner.temp }}/fuzz-${{ matrix.target }}/fuzz.log
          if-no-files-found: ignore
          retention-days: 30
