name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["m*-complete*"]

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. A commit on main
# and a tag always get a complete run: outside pull requests the group also
# names the commit, because GitHub keeps one pending run per group and drops
# the older pending one even when cancel-in-progress is false.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The lint jobs come first and need no container: a formatting, Clippy or
  # rustdoc error in any of the Cargo workspaces is reported within minutes,
  # not at the end of the slow job that also builds and tests that workspace.
  # Both run scripts/check-all.sh, the command a contributor runs before a
  # push; the slow jobs below keep their own checks.
  lint:
    name: fast lint (fmt of every workspace, root Clippy and rustdoc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: ./scripts/check-all.sh --fast --rust-only

  lint-separate:
    name: lint of the separate Cargo workspaces (${{ matrix.shard }})
    # Sharded so that each shard reports within about ten minutes on a cold
    # runner. scripts/test-check-all-workspaces.sh fails when a workspace
    # check-all.sh lints is in no shard or in two.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: provisional LEZ v0.2
            manifests: compat/lez-v0.2-provisional/Cargo.toml
            cache: lint-provisional-lez-v02
          - shard: provisional escrow guest, methods and deployer
            manifests: >-
              compat/lez-v0.2-provisional/escrow/methods/guest/Cargo.toml
              compat/lez-v0.2-provisional/escrow/methods/Cargo.toml
              compat/lez-v0.2-provisional/escrow/deployer/Cargo.toml
          - shard: sidecar, SPEL escrow and standalone
            manifests: >-
              compat/lez-v0_2-sidecar/Cargo.toml
              compat/spel-zec-escrow/Cargo.toml
              compat/spel-zec-escrow/methods/guest/Cargo.toml
              compat/spel-zec-escrow/methods/Cargo.toml
              compat/lez-standalone-e2e/Cargo.toml
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        id: toolchain
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Install the smart-card library the LEZ v0.2.4 wallet crate links
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpcsclite-dev
      # Third-party build output only: the prune step removes this shard's
      # own crates before any Cargo command, so they are linted from source.
      - name: Restore this shard's Cargo registry and dependency builds
        id: cargo-cache
        if: matrix.cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/check-all
          key: ${{ matrix.cache }}-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('compat/lez-v0.2-provisional/Cargo.lock') }}
      - name: Prune the restored Cargo target of this shard's own crates
        if: matrix.cache
        run: ./scripts/ci-cargo-cache-prune.sh target/check-all compat/lez-v0.2-provisional/Cargo.toml
      - name: Lint this shard's workspaces
        env:
          MANIFESTS: ${{ matrix.manifests }}
        run: |
          set -euo pipefail
          read -r -a manifests <<<"$MANIFESTS"
          args=()
          for manifest in "${manifests[@]}"; do
            args+=(--workspace "$manifest")
          done
          ./scripts/check-all.sh --separate --rust-only "${args[@]}"
      - name: Prune this shard's own crates before saving
        id: cargo-prune
        if: matrix.cache && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        env:
          CI_CACHE_MAX_GIB: "2"
        run: |
          echo "fits=true" >>"$GITHUB_OUTPUT"
          ./scripts/ci-cargo-cache-prune.sh target/check-all compat/lez-v0.2-provisional/Cargo.toml
      - name: Save this shard's Cargo registry and dependency builds
        if: matrix.cache && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-prune.outputs.fits == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/check-all
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  ci-quality:
    name: shell, workflow, Dockerfile, and Compose quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned ripgrep
        run: ./scripts/install-ci-ripgrep.sh
      - run: ./scripts/test-lez-cost-evidence.sh
      - run: ./scripts/test-ci-hardening-policy.sh
      - run: ./scripts/test-spin-lock-remediation.sh
      - run: ./scripts/check-github-action-pins.sh
      - run: ./scripts/run-ci-quality-gates.sh
      - run: ./scripts/check-bitcoin-core-isolation.sh
      - run: ./scripts/check-lez-v02-docker-isolation.sh
      - run: ./scripts/check-runtime-profiles.py
      - run: python3 -m unittest discover -s deploy/tests

  container-security:
    name: Runtime findings fail-hard; classified upstream findings remain visible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned ripgrep
        run: ./scripts/install-ci-ripgrep.sh
      - name: Scan repository-owned runtime base for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cgr.dev/chainguard/glibc-dynamic:latest@sha256:5bb932663cff4fb276186720e0357af55c5e47f12e4d9f44ea0060fa3e7bca88
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      # This build-only upstream image currently has disclosed findings. Its
      # digest and output ELF are pinned; production release remains blocked
      # until TOOLCHAIN-001 is closed, while the local-functional PoC stays testable.
      - name: Report pinned Risc0 guest builder high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: risczero/risc0-guest-builder:r0.1.94.1@sha256:c2f63fdd720337c0727e05c5e1733083baba04c00a864a89b0e3f4f8d92617be
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Report high and critical vulnerabilities in exact Logos Bedrock dependency
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/logos-blockchain/logos-blockchain@sha256:70539769f3a2a014b36e608f76264e5d2297f14ee3f7fabf4715f071c7bbf8e7
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned ripgrep
        run: ./scripts/install-ci-ripgrep.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        id: toolchain
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      # Third-party build output only: the prune step removes the workspace's
      # own crates before any Cargo command, so they build and test from source.
      - name: Restore the Cargo registry and dependency builds
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-workspace-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
      - name: Prune the restored Cargo target of the workspace's own crates
        run: ./scripts/ci-cargo-cache-prune.sh target Cargo.toml
      - name: Install pinned Node tooling
        run: npm ci
      - name: Audit Node tooling dependencies
        run: npm audit --audit-level=moderate
      - name: Audit Node tooling licenses
        run: npm run audit:licenses
      - name: Exercise M6 clickable role prototypes
        env:
          M6_UI_TEST_ROOT: ${{ runner.temp }}/lez-m6-ui-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          google-chrome --version
          npm run test:m6:prototype
      - name: Verify M6 Basecamp package boundary
        run: npm run test:m6:basecamp:contract
      - name: Verify third-party owner API client
        run: python3 -m unittest discover -s examples/owner-api -v
      - run: cargo fmt --all --check
      - run: >-
          cargo clippy --locked --workspace --all-targets
          --exclude lez-xmr-monero-adapter
          --exclude lez-xmr-release-authority
          --exclude xmr-reference-actor
          --exclude lez-xmr-swap-sdk
          -- -D warnings
      - run: >-
          cargo test --locked --workspace --all-targets
          --exclude lez-xmr-monero-adapter
          --exclude lez-xmr-release-authority
          --exclude xmr-reference-actor
          --exclude lez-xmr-swap-sdk
      # Nine Node test files are `#![cfg(feature = "pair-zec")]`, so the default
      # workspace run above compiles them to nothing and reports zero tests.
      # M2 is the ZEC leg, so they run here. XMR stays parked until M4 and is
      # still lint-only below.
      - name: Run the pair-zec gated Node test files
        run: cargo test --locked -p lez-maker-node -p lez-taker-node --features pair-zec --all-targets
      - name: Lint the pair features the default build leaves out
        run: cargo clippy --locked -p lez-maker-node -p lez-taker-node --all-features --all-targets -- -D warnings
      - name: Verify M3 official cryptographic vectors
        run: |
          ./scripts/check-m3-cryptographic-vectors.sh
          cargo test --locked -p lez-btc-swap-sdk --test bip340_vectors --test bip327_vectors --test adaptor_vectors
      - name: Verify Bitcoin Testnet4 route contract
        run: ./scripts/test-bitcoin-testnet4-route-contract.sh
      - name: Reject Rust documentation warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --locked --workspace --no-deps
          --exclude lez-xmr-monero-adapter
          --exclude lez-xmr-release-authority
          --exclude xmr-reference-actor
          --exclude lez-xmr-swap-sdk
      - run: ./scripts/check-requirements-traceability.sh
      - run: ./scripts/check-architecture-diagrams.sh
      - name: Prune the workspace's own crates before saving
        id: cargo-prune
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        env:
          CI_CACHE_MAX_GIB: "4"
        run: |
          echo "fits=true" >>"$GITHUB_OUTPUT"
          ./scripts/ci-cargo-cache-prune.sh target Cargo.toml
      - name: Save the Cargo registry and dependency builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-prune.outputs.fits == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  basecamp-ui:
    name: Maker and Taker Basecamp integration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run both role packages in the official Basecamp test harness
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo:ro"
          --workdir /repo
          nixos/nix:2.30.2@sha256:7894650fb65234b35c80010e6ca44149b70a4a216118a6b7e5c6f6ae377c8d21
          bash /repo/scripts/test-m6-basecamp-integration.sh

  dependencies:
    name: dependency vulnerabilities, licenses, bans, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned ripgrep
        run: ./scripts/install-ci-ripgrep.sh
      - run: ./scripts/check-spin-lock-remediation.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          command: check advisories bans licenses sources
          arguments: --all-features
      - name: Audit official LEZ v0.2 sidecar graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0_2-sidecar/Cargo.toml
          command: check
          arguments: --all-features --config compat/lez-v0_2-sidecar/deny.toml
          command-arguments: advisories bans licenses sources
      - name: Audit LEZ v0.2 sequencer reproducers graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-sequencer-reproducers/Cargo.toml
          command: check
          arguments: --all-features --config compat/lez-v0.2-sequencer-reproducers/deny.toml
          command-arguments: advisories bans licenses sources
      - name: Audit LEZ v0.2 sequencer reproducer guest graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-sequencer-reproducers/guest/Cargo.toml
          command: check
          arguments: --all-features --config compat/lez-v0.2-sequencer-reproducers/guest/deny.toml
          command-arguments: advisories bans licenses sources
      - name: Audit provisional LEZ v0.2 compatibility graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-provisional/Cargo.toml
          command: check
          arguments: --all-features --config compat/lez-v0.2-provisional/deny.toml
          command-arguments: advisories bans licenses sources
      # Nested v0.2 graphs do not inherit the root compile-only policy. Any
      # Logos-owned exception is justified in that graph's own deny.toml and
      # paired with the verifier's feature/reachability checks.
      - name: Audit provisional LEZ v0.2 Risc0 methods graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-provisional/escrow/methods/Cargo.toml
          command: check
          arguments: --all-features --config compat/lez-v0.2-provisional/escrow/methods/deny.toml
          command-arguments: advisories bans licenses sources
      - name: Audit provisional LEZ v0.2 guest graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-provisional/escrow/methods/guest/Cargo.toml
          command: check
          arguments: --all-features --config compat/lez-v0.2-provisional/escrow/methods/guest/deny.toml
          command-arguments: advisories bans licenses sources
      - name: Audit provisional LEZ v0.2 deployer graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-provisional/escrow/deployer/Cargo.toml
          command: check
          arguments: --all-features --config compat/lez-v0.2-provisional/escrow/deployer/deny.toml
          command-arguments: advisories bans licenses sources
  lez-v02-sidecar:
    name: isolated official LEZ v0.2 sidecar contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BINDGEN_EXTRA_CLANG_ARGS: -I/usr/lib/gcc/x86_64-linux-gnu/13/include
      CARGO_BUILD_JOBS: "2"
      CARGO_DENY_ARCHIVE_SHA256: f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af
      CARGO_DENY_ARCHIVE_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz
      # Fixed paths so that a cached target stays fresh (Cargo records
      # absolute paths); a hosted runner runs one job at a time.
      CARGO_HOME: /tmp/lez-v02-sidecar-cargo
      CARGO_TARGET_DIR: /tmp/lez-v02-sidecar-target
      RAPIDSNARK_ARCHIVE_SHA256: 59bdd709eed96235de061f352893f4650c923b54b591052118593012bb1cd831
      RAPIDSNARK_ARCHIVE_URL: https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark/releases/download/rapidsnark-pic-v0.0.8/rapidsnark-linux-x86_64-pic-v0.0.8.zip
      RAPIDSNARK_LIB_DIR: /tmp/lez-v02-rapidsnark-${{ github.run_id }}-${{ github.run_attempt }}/rapidsnark-linux-x86_64-pic-v0.0.8/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned ripgrep
        run: ./scripts/install-ci-ripgrep.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        id: toolchain
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Install the smart-card library the LEZ v0.2.4 wallet crate links
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpcsclite-dev
      # Third-party build output and the locked sources only. The advisory
      # database is not cached: cargo-deny fetches it fresh on every run.
      - name: Restore the sidecar Cargo registry and dependency builds
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/lez-v02-sidecar-cargo/registry/index
            /tmp/lez-v02-sidecar-cargo/registry/cache
            /tmp/lez-v02-sidecar-cargo/git/db
            /tmp/lez-v02-sidecar-target
          key: lez-v02-sidecar-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('compat/lez-v0_2-sidecar/Cargo.lock') }}
      - name: Prune the restored Cargo target of the sidecar's own crates
        run: ./scripts/ci-cargo-cache-prune.sh /tmp/lez-v02-sidecar-target compat/lez-v0_2-sidecar/Cargo.toml
      - name: Provision checksum-verified sidecar native and audit inputs
        run: |
          set -euo pipefail
          rapidsnark_archive="${RUNNER_TEMP}/rapidsnark-linux-x86_64-pic-v0.0.8.zip"
          rapidsnark_root="${RAPIDSNARK_LIB_DIR%/rapidsnark-linux-x86_64-pic-v0.0.8/lib}"
          cargo_deny_archive="${RUNNER_TEMP}/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz"
          cargo_deny_dir="${RUNNER_TEMP}/cargo-deny-0.19.9"
          mkdir -p "${rapidsnark_root}" "${cargo_deny_dir}"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "${rapidsnark_archive}" "${RAPIDSNARK_ARCHIVE_URL}"
          printf '%s  %s\n' "${RAPIDSNARK_ARCHIVE_SHA256}" "${rapidsnark_archive}" \
            | sha256sum --check --strict
          unzip -q "${rapidsnark_archive}" -d "${rapidsnark_root}"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "${cargo_deny_archive}" "${CARGO_DENY_ARCHIVE_URL}"
          printf '%s  %s\n' "${CARGO_DENY_ARCHIVE_SHA256}" "${cargo_deny_archive}" \
            | sha256sum --check --strict
          tar -xzf "${cargo_deny_archive}" -C "${cargo_deny_dir}" --strip-components=1
          chmod 0555 "${cargo_deny_dir}/cargo-deny"
          test -d "${RAPIDSNARK_LIB_DIR}"
          test -d /usr/lib/gcc/x86_64-linux-gnu/13/include
          printf '%s\n' "${cargo_deny_dir}" >>"${GITHUB_PATH}"
      - name: Fetch exact locked sidecar sources and advisory database
        run: |
          set -euo pipefail
          cargo +1.96.0 fetch \
            --locked \
            --manifest-path compat/lez-v0_2-sidecar/Cargo.toml
          cargo-deny --version | rg -Fx 'cargo-deny 0.19.9'
          cargo-deny \
            --log-level error \
            --manifest-path compat/lez-v0_2-sidecar/Cargo.toml \
            --locked \
            --all-features \
            check \
            --config compat/lez-v0_2-sidecar/deny.toml \
            advisories
      - name: Verify LEZ v0.2 sidecar with Cargo offline
        run: ./scripts/verify-lez-v02-sidecar.sh
      - name: Prune the sidecar's own crates before saving
        id: cargo-prune
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        env:
          CI_CACHE_MAX_GIB: "3"
        run: |
          echo "fits=true" >>"$GITHUB_OUTPUT"
          ./scripts/ci-cargo-cache-prune.sh /tmp/lez-v02-sidecar-target compat/lez-v0_2-sidecar/Cargo.toml
      - name: Save the sidecar Cargo registry and dependency builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-prune.outputs.fits == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/lez-v02-sidecar-cargo/registry/index
            /tmp/lez-v02-sidecar-cargo/registry/cache
            /tmp/lez-v02-sidecar-cargo/git/db
            /tmp/lez-v02-sidecar-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  lez-v02-provisional:
    name: provisional LEZ v0.2 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      # Fixed paths so that cached tools and targets stay valid (rzup and
      # Cargo record absolute paths); a hosted runner runs one job at a time.
      CARGO_TARGET_DIR: /tmp/lez-v02-provisional-target
      LEZ_V02_GUEST_TARGET_DIR: /tmp/lez-v02-provisional-guest-target
      LEZ_V02_ARTIFACT_TARGET_DIR: /tmp/lez-v02-provisional-artifact-target
      LEZ_V02_TOOL_DIR: /tmp/lez-v02-provisional-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned ripgrep
        run: ./scripts/install-ci-ripgrep.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        id: toolchain
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: Install the smart-card library the LEZ v0.2.4 wallet crate links
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpcsclite-dev
      # rzup, the Risc0 Rust toolchain, r0vm, cargo-risczero and the circuits,
      # as the verifier installs them. Every pin is in the verifier, so the key
      # hashes it; the verifier checks each tool's version on every run.
      - name: Restore the provisional LEZ v0.2 Risc0 tools
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/lez-v02-provisional-tools
            !/tmp/lez-v02-provisional-tools/cargo-home/registry
            !/tmp/lez-v02-provisional-tools/cargo-home/git
          key: lez-v02-provisional-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/verify-lez-v02-provisional.sh') }}
      # Third-party build output only. The prune step removes every crate of
      # the four workspaces and every guest build before Cargo runs, so the
      # Docker guest build and both ImageID checks run from source each time.
      - name: Restore the provisional LEZ v0.2 Cargo registry and dependency builds
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            /tmp/lez-v02-provisional-target
            /tmp/lez-v02-provisional-guest-target
            /tmp/lez-v02-provisional-artifact-target
            !/tmp/lez-v02-provisional-artifact-target/riscv-guest
            !/tmp/lez-v02-provisional-artifact-target/docker-guest-source
          key: lez-v02-provisional-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('compat/lez-v0.2-provisional/Cargo.lock', 'compat/lez-v0.2-provisional/escrow/methods/Cargo.lock', 'compat/lez-v0.2-provisional/escrow/methods/guest/Cargo.lock', 'compat/lez-v0.2-provisional/escrow/deployer/Cargo.lock') }}
      - name: Prune the restored Cargo targets of the workspaces' own crates and guest builds
        run: |
          ./scripts/ci-cargo-cache-prune.sh /tmp/lez-v02-provisional-target compat/lez-v0.2-provisional/Cargo.toml
          ./scripts/ci-cargo-cache-prune.sh /tmp/lez-v02-provisional-guest-target compat/lez-v0.2-provisional/escrow/methods/guest/Cargo.toml
          ./scripts/ci-cargo-cache-prune.sh /tmp/lez-v02-provisional-artifact-target compat/lez-v0.2-provisional/escrow/methods/Cargo.toml compat/lez-v0.2-provisional/escrow/deployer/Cargo.toml
      - run: ./scripts/verify-lez-v02-provisional.sh
      - name: Save the provisional LEZ v0.2 Risc0 tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/lez-v02-provisional-tools
            !/tmp/lez-v02-provisional-tools/cargo-home/registry
            !/tmp/lez-v02-provisional-tools/cargo-home/git
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Prune the workspaces' own crates and guest builds before saving
        id: cargo-prune
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        env:
          CI_CACHE_MAX_GIB: "4"
        run: |
          echo "fits=true" >>"$GITHUB_OUTPUT"
          ./scripts/ci-cargo-cache-prune.sh /tmp/lez-v02-provisional-target compat/lez-v0.2-provisional/Cargo.toml
          ./scripts/ci-cargo-cache-prune.sh /tmp/lez-v02-provisional-guest-target compat/lez-v0.2-provisional/escrow/methods/guest/Cargo.toml
          ./scripts/ci-cargo-cache-prune.sh /tmp/lez-v02-provisional-artifact-target compat/lez-v0.2-provisional/escrow/methods/Cargo.toml compat/lez-v0.2-provisional/escrow/deployer/Cargo.toml
      - name: Save the provisional LEZ v0.2 Cargo registry and dependency builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-prune.outputs.fits == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            /tmp/lez-v02-provisional-target
            /tmp/lez-v02-provisional-guest-target
            /tmp/lez-v02-provisional-artifact-target
            !/tmp/lez-v02-provisional-artifact-target/riscv-guest
            !/tmp/lez-v02-provisional-artifact-target/docker-guest-source
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  bitcoin-core-regtest:
    name: isolated Bitcoin Core 31.1 Regtest MuSig2 adaptor P2TR spend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_ID: github-btc-${{ github.run_id }}-${{ github.run_attempt }}
      BITCOIN_CORE_E2E_KEEP_RUNNING: "1"
      BITCOIN_CORE_E2E_REQUIRE_CLEAN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned ripgrep
        run: ./scripts/install-ci-ripgrep.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
      - name: Verify release and run role-aware MuSig2 adaptor P2TR funding and claim
        run: ./scripts/run-bitcoin-core-e2e.sh
      - name: Scan exact Bitcoin Core image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lez-atomic-swaps-bitcoin-core:github-btc-${{ github.run_id }}-${{ github.run_attempt }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Remove only the exact Core CI resources
        if: always()
        run: |
          set -euo pipefail
          project="lez-atomic-swaps-bitcoin-core-${RUN_ID}"
          volume="${project}_core_data"
          network="${project}_bitcoin_core_private"
          image="lez-atomic-swaps-bitcoin-core:${RUN_ID}"
          mapfile -t containers < <(docker container ls --all --quiet \
            --filter "label=org.logos-co.atomic-swaps.run=${RUN_ID}")
          if (( ${#containers[@]} > 1 )); then
            echo "refusing ambiguous Bitcoin CI cleanup for ${RUN_ID}" >&2
            exit 1
          fi
          if (( ${#containers[@]} == 1 )); then
            docker container rm --force "${containers[0]}" >/dev/null
          fi
          docker volume rm "${volume}" >/dev/null 2>&1 || true
          docker network rm "${network}" >/dev/null 2>&1 || true
          docker image rm "${image}" >/dev/null 2>&1 || true
          test -z "$(docker container ls --all --quiet \
            --filter "label=org.logos-co.atomic-swaps.run=${RUN_ID}")"
          test -z "$(docker network ls --quiet \
            --filter "label=org.logos-co.atomic-swaps.run=${RUN_ID}")"
          test -z "$(docker volume ls --quiet \
            --filter "label=org.logos-co.atomic-swaps.run=${RUN_ID}")"

  zebra-regtest:
    name: isolated Zebra Regtest BIP-199 HTLC fund, claim, and refund
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_ID: github-zec-${{ github.run_id }}-${{ github.run_attempt }}
      ZEBRA_E2E_KEEP_RUNNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned ripgrep
        run: ./scripts/install-ci-ripgrep.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
      - name: Fund, claim, and refund a real HTLC through Zebra consensus
        run: ./scripts/run-zebra-e2e.sh
      # Report-only, like the other upstream-owned images: this one copies
      # zebrad out of zfnd/zebra at a fixed digest, so its OS packages are not
      # ours to fix. Repository-owned images stay fail-hard.
      - name: Report exact Zebra image high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lez-atomic-swaps-zebra:github-zec-${{ github.run_id }}-${{ github.run_attempt }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Remove only the exact Zebra CI resources
        if: always()
        run: |
          set -euo pipefail
          project="lez-atomic-swaps-${RUN_ID}"
          image="lez-atomic-swaps-zebra:${RUN_ID}"
          docker compose --project-name "${project}" \
            --file tests/e2e/zebra/compose.yml down --volumes --remove-orphans >/dev/null 2>&1 || true
          mapfile -t containers < <(docker container ls --all --quiet \
            --filter "label=org.logos-co.atomic-swaps.run=${RUN_ID}")
          # The regtest stack is exactly two nodes: the primary and its fork.
          if (( ${#containers[@]} > 2 )); then
            echo "refusing ambiguous Zebra CI cleanup for ${RUN_ID}" >&2
            exit 1
          fi
          for container in "${containers[@]+"${containers[@]}"}"; do
            docker container rm --force "${container}" >/dev/null
          done
          docker image rm "${image}" >/dev/null 2>&1 || true
          test -z "$(docker container ls --all --quiet \
            --filter "label=org.logos-co.atomic-swaps.run=${RUN_ID}")"
          test -z "$(docker network ls --quiet \
            --filter "label=org.logos-co.atomic-swaps.run=${RUN_ID}")"
          test -z "$(docker volume ls --quiet \
            --filter "label=org.logos-co.atomic-swaps.run=${RUN_ID}")"
