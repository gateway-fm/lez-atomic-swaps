name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Install pinned Mermaid renderer
        run: npm ci
      - name: Audit Mermaid renderer dependencies
        run: npm audit --audit-level=moderate
      - name: Audit Mermaid renderer licenses
        run: npm run audit:licenses
      - name: Lint shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Reject Rust documentation warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - run: ./scripts/check-requirements-traceability.sh
      - run: ./scripts/check-architecture-diagrams.sh
      - run: ./scripts/check-docker-isolation.sh

  dependencies:
    name: dependency vulnerabilities, licenses, bans, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          command: check advisories bans licenses sources
          arguments: --all-features
      - name: Audit pinned SPEL/LEZ compatibility graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/spel-zec-escrow/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: --config compat/spel-zec-escrow/deny.toml advisories bans licenses sources
      - name: Audit deployable Risc0 guest graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/spel-zec-escrow/methods/guest/Cargo.toml
          command: check
          command-arguments: --config compat/spel-zec-escrow/deny.toml advisories bans licenses sources
      - name: Audit Risc0 methods wrapper graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/spel-zec-escrow/methods/Cargo.toml
          command: check
          command-arguments: --config compat/spel-zec-escrow/deny.toml advisories bans licenses sources
      - name: Audit standalone sequencer E2E graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-standalone-e2e/Cargo.toml
          command: check
          command-arguments: --config compat/lez-standalone-e2e/deny.toml advisories bans licenses sources
      - name: Audit official LEZ v0.1.2 sidecar graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0_1_2-sidecar/Cargo.toml
          command: check
          command-arguments: --config compat/lez-v0_1_2-sidecar/deny.toml advisories bans licenses sources
      - name: Audit provisional LEZ v0.2 compatibility graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-provisional/Cargo.toml
          command: check
          command-arguments: --config compat/lez-v0.2-provisional/deny.toml advisories bans licenses sources
      # Nested v0.2 graphs do not inherit the root compile-only policy. Any
      # Logos-owned exception is justified in that graph's own deny.toml and
      # paired with the verifier's feature/reachability checks.
      - name: Audit provisional LEZ v0.2 Risc0 methods graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-provisional/escrow/methods/Cargo.toml
          command: check
          command-arguments: --config compat/lez-v0.2-provisional/escrow/methods/deny.toml advisories bans licenses sources
      - name: Audit provisional LEZ v0.2 guest graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-provisional/escrow/methods/guest/Cargo.toml
          command: check
          command-arguments: --config compat/lez-v0.2-provisional/escrow/methods/guest/deny.toml advisories bans licenses sources
      - name: Audit provisional LEZ v0.2 deployer graph
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          rust-version: "1.96.0"
          manifest-path: compat/lez-v0.2-provisional/escrow/deployer/Cargo.toml
          command: check
          command-arguments: --config compat/lez-v0.2-provisional/escrow/deployer/deny.toml advisories bans licenses sources

  spel-compatibility:
    name: pinned SPEL and LEZ compatibility
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.0
      - run: ./scripts/verify-spel-compatibility.sh

  lez-v012-sidecar:
    name: isolated official LEZ v0.1.2 sidecar contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ runner.temp }}/lez-v012-sidecar-target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path compat/lez-v0_1_2-sidecar/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path compat/lez-v0_1_2-sidecar/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path compat/lez-v0_1_2-sidecar/Cargo.toml --all-targets --all-features
      - name: Reject sidecar documentation warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path compat/lez-v0_1_2-sidecar/Cargo.toml --all-features --no-deps

  lez-v02-provisional:
    name: provisional LEZ v0.2 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: ${{ runner.temp }}/lez-v02-provisional-target
      LEZ_V02_GUEST_TARGET_DIR: ${{ runner.temp }}/lez-v02-provisional-guest-target
      LEZ_V02_ARTIFACT_TARGET_DIR: ${{ runner.temp }}/lez-v02-provisional-artifact-target
      LEZ_V02_TOOL_DIR: ${{ runner.temp }}/lez-v02-provisional-tools
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - run: ./scripts/verify-lez-v02-provisional.sh

  lez-standalone:
    name: deployable guest on isolated LEZ standalone
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      LEZ_E2E_TOOL_DIR: ${{ runner.temp }}/lez-risc0-3.0.5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - run: ./scripts/run-lez-standalone-e2e.sh

  zebra-regtest:
    name: isolated Zebra actor consensus and maker restart E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      ZEBRA_IMAGE: lez-atomic-swaps-zebra:github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.96.0
      - name: Build provenance-pinned minimal Zebra image
        run: docker build --file tests/e2e/zebra/Dockerfile --tag "$ZEBRA_IMAGE" tests/e2e/zebra
      - name: Scan minimal Zebra image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ZEBRA_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - run: ./scripts/run-zebra-e2e.sh
