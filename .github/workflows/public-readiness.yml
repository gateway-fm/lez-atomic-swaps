name: public-readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: repository and direct-source contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./scripts/verify-public-repository.sh

  dco:
    name: developer certificate of origin
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require an author-matching or exact Dependabot service sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi
          if [[ -n "$BASE_SHA" ]]; then
            commit_list="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          else
            commit_list="$HEAD_SHA"
          fi
          failed=0
          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            author="$(git show -s --format='%an <%ae>' "$commit")"
            signoffs="$(git show -s --format='%B' "$commit" \
              | sed -n 's/^Signed-off-by:[[:space:]]*//Ip')"
            if grep -Fxi -- "$author" <<<"$signoffs" >/dev/null; then
              continue
            fi
            if [[ "$author" == 'dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>' ]] \
              && grep -Fxi -- 'dependabot[bot] <support@github.com>' <<<"$signoffs" >/dev/null; then
              continue
            fi
            echo "${commit} lacks an accepted DCO sign-off for ${author}" >&2
            failed=1
          done <<<"$commit_list"
          test "$failed" = 0

  secret-history:
    name: full reachable-history secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks 8.30.1
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" git . --no-banner --redact --exit-code 1

  dependency-policy:
    name: dependency vulnerabilities and licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - name: Audit Node dependency and licence policy
        run: |
          npm audit --audit-level=moderate
          npm run audit:licenses
      - name: Audit Rust advisories, bans, licences, and sources
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-deny"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' \
            '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f' \
            "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          audit_graph() {
            local manifest="$1"
            local config="$2"
            local features="$3"
            local args=(
              --manifest-path "$manifest"
              --config "$config"
              --locked
            )
            if [[ "$features" == all ]]; then
              args+=(--all-features)
            fi
            "$install_dir/cargo-deny" "${args[@]}" \
              check advisories bans licenses sources
          }

          audit_graph Cargo.toml deny.toml all
          audit_graph compat/lez-v0_2-sidecar/Cargo.toml \
            compat/lez-v0_2-sidecar/deny.toml all
          audit_graph compat/lez-v0.2-provisional/Cargo.toml \
            compat/lez-v0.2-provisional/deny.toml default
          audit_graph compat/lez-v0.2-provisional/escrow/methods/Cargo.toml \
            compat/lez-v0.2-provisional/escrow/methods/deny.toml default
          audit_graph compat/lez-v0.2-provisional/escrow/methods/guest/Cargo.toml \
            compat/lez-v0.2-provisional/escrow/methods/guest/deny.toml default
          audit_graph compat/lez-v0.2-provisional/escrow/deployer/Cargo.toml \
            compat/lez-v0.2-provisional/escrow/deployer/deny.toml default

  chat-delivery:
    name: Chat and Delivery tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - name: Test independent-role Chat, Delivery discovery, and conflict resolution
        run: >-
          cargo test --locked -p lez-maker-node
          --lib
          --test btc_chat_process
          --test logos_offer_discovery
          --test run_local_delivery
