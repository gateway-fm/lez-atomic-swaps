[package]
name = "xmr-reference-actor"
version = "0.1.0"
description = "Role-fixed reference material actor for LEZ and Monero atomic swaps"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.6.1", features = ["derive"] }
hex = "=0.4.3"
lez-xmr-swap-sdk = { version = "=0.1.0", path = "../xmr-swap-sdk" }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc", "rand-std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"
