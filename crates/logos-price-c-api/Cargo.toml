[package]
name = "lez-logos-price-c-api"
version = "0.1.0"
description = "Crash-isolated versioned Logos module price C-API boundary"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This is the only workspace crate permitted to call a foreign ABI. The fund-
# owning daemon and all protocol crates continue to inherit unsafe_code=forbid.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
libloading = { version = "=0.9.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"
