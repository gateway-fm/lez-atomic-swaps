[package]
name = "lez-node-common"
version = "0.1.0"
description = "Role-neutral runtime boundaries shared by LEZ Maker and Taker Nodes"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

[lints]
workspace = true

[[bin]]
name = "lez-chat-relay"
path = "src/bin/lez-chat-relay.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
jsonrpsee = { version = "0.26.0", features = ["client-core", "server"] }
lez-bridge-protocol = { version = "0.1.0", path = "../lez-bridge-protocol" }
lez-swap-sdk-core = { version = "0.1.0", path = "../swap-sdk-core" }
lez-swap-store = { version = "0.1.0", path = "../swap-store" }
lez-xmr-swap-sdk = { version = "0.1.0", path = "../xmr-swap-sdk" }
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "=0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wait-timeout = "=0.2.1"
zeroize = "=1.9.0"

[dev-dependencies]
lez-swap-core = { version = "0.1.0", path = "../swap-core" }
