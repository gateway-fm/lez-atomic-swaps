[package]
name = "lez-btc-core-adapter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
bitcoin = { version = "=0.32.101", default-features = false, features = ["std"] }
corepc-types = { version = "=0.15.0", default-features = false, features = ["std", "serde-deny-unknown-fields"] }
hex = "=0.4.3"
jsonrpsee = { version = "=0.26.0", features = ["client-core"] }
jsonrpsee-http-client = { version = "=0.26.0", default-features = false, features = ["tls"] }
lez-btc-swap-sdk = { version = "0.1.0", path = "../btc-swap-sdk" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
jsonrpsee-server = "=0.26.0"
lez-swap-core = { version = "0.1.0", path = "../swap-core" }
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["macros", "rt"] }

[lints]
workspace = true
