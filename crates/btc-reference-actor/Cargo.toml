[package]
name = "btc-reference-actor"
autobins = false
version = "0.1.0"
description = "One-shot role-fixed reference actor for LEZ and Bitcoin atomic swaps"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lez-btc-maker-actor"
path = "src/bin/lez-btc-maker-actor.rs"

[[bin]]
name = "lez-btc-taker-actor"
path = "src/bin/lez-btc-taker-actor.rs"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
bitcoin = { version = "=0.32.101", default-features = false, features = ["std"] }
getrandom = "0.3.4"
clap = { version = "4.6.0", features = ["derive"] }
hex = "0.4.3"
lez-btc-core-adapter = { version = "0.1.0", path = "../btc-core-adapter" }
lez-bridge-adapter = { version = "0.1.0", path = "../lez-bridge-adapter" }
lez-bridge-client = { version = "0.1.0", path = "../lez-bridge-client" }
lez-bridge-protocol = { version = "0.1.0", path = "../lez-bridge-protocol" }
lez-btc-swap-sdk = { version = "0.1.0", path = "../btc-swap-sdk" }
lez-swap-core = { version = "0.1.0", path = "../swap-core" }
lez-swap-sdk-core = { version = "0.1.0", path = "../swap-sdk-core" }
lez-swap-store = { version = "0.1.0", path = "../swap-store" }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "=0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt", "sync"] }
zeroize = "=1.9.0"

[dev-dependencies]
command-fds = "=0.3.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
corepc-types = { version = "=0.15.0", default-features = false, features = ["std", "serde-deny-unknown-fields"] }
tempfile = "3.27.0"
