[package]
name = "lez-bridge-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
jsonrpsee = { version = "0.26.0", features = ["client-core"] }
jsonrpsee-http-client = { version = "0.26.0", default-features = false }
lez-bridge-protocol = { version = "0.1.0", path = "../lez-bridge-protocol" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "=0.10.9"
thiserror = "2.0.12"
url = "2.5.4"
zeroize = "1.8.1"

[dev-dependencies]
jsonrpsee = { version = "0.26.0", features = ["server"] }
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "time"] }
tower = "0.5.2"
tower-http = { version = "0.7.0", features = ["auth"] }

[lints]
workspace = true
