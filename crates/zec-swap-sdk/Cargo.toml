[package]
name = "lez-zec-swap-sdk"
version = "0.1.0"
description = "Transparent Zcash protocol adapter for LEZ atomic swaps"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
borsh = { version = "=1.7.0", features = ["derive"] }
lez-swap-core = { version = "0.1.0", path = "../swap-core" }
orchard = { version = "=0.14.0", default-features = false }
sapling = { package = "sapling-crypto", version = "=0.7.0", default-features = false }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "2.0.12"
zcash_primitives = { version = "=0.28.0", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.9.0", default-features = false }
zcash_script = { version = "=0.4.3", default-features = false, features = ["signature-validation"] }
zcash_transparent = { version = "=0.8.0", default-features = false, features = ["transparent-inputs"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
jsonrpsee = { version = "0.26.0", features = ["client-core"] }
jsonrpsee-http-client = { version = "0.26.0", default-features = false }
serde_json = "1.0.150"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread", "time"] }
zcash_encoding = "=0.4.0"
