[package]
name = "lez-maker-node"
version = "0.1.0"
description = "Role-fixed Maker Node and operator CLI for LEZ atomic swaps"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

[lints]
workspace = true

[features]
# BTC<->LEZ is always built. Each other pair compiles only when requested, so
# the shipped Maker Node carries no actor code CI has not exercised.
default = []
pair-zec = ["dep:zec-reference-actor", "dep:lez-zec-swap-sdk"]
pair-xmr = ["dep:xmr-reference-actor", "dep:lez-xmr-swap-sdk"]
test-crash-hooks = ["pair-zec", "zec-reference-actor/test-crash-hooks"]

[[bin]]
name = "lez-maker-node"
path = "src/bin/lez-maker-node.rs"

[[bin]]
name = "lez-maker-cli"
path = "src/bin/lez-maker-cli.rs"

[[bin]]
name = "lez-maker-chat-gateway"
path = "src/bin/lez-maker-chat-gateway.rs"

[[bin]]
name = "lez-xmr-maker-actor"
path = "src/bin/xmr-maker-actor.rs"
required-features = ["pair-xmr"]

[[example]]
name = "m5-systemd-fault-actor"
path = "examples/m5-systemd-fault-actor.rs"
required-features = ["test-crash-hooks"]

[[example]]
name = "m5-systemd-actor-fixture"
path = "examples/m5-systemd-actor-fixture.rs"
required-features = ["pair-zec"]

[[example]]
name = "m5-systemd-actor-store"
path = "examples/m5-systemd-actor-store.rs"
required-features = ["pair-zec"]

[[example]]
name = "maker-zec-lock-intent-inspect"
path = "examples/maker-zec-lock-intent-inspect.rs"
required-features = ["pair-zec"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
async-trait = "0.1.89"
bytes = "1.12.1"
btc-reference-actor = { version = "0.1.0", path = "../btc-reference-actor" }
btc-role-preflight = { version = "0.1.0", path = "../btc-role-preflight" }
lez-btc-swap-sdk = { version = "0.1.0", path = "../btc-swap-sdk" }
clap = { version = "4.6.0", features = ["derive", "env"] }
http-body-util = "0.1.3"
hex = "0.4.3"
getrandom = "=0.3.4"
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
jsonrpsee = { version = "0.26.0", features = ["client-core", "server"] }
lez-node-common = { version = "0.1.0", path = "../node-common" }
lez-bridge-protocol = { version = "0.1.0", path = "../lez-bridge-protocol" }
lez-logos-price-c-api = { version = "0.1.0", path = "../logos-price-c-api", default-features = false }
lez-swap-core = { version = "0.1.0", path = "../swap-core" }
lez-swap-sdk-core = { version = "0.1.0", path = "../swap-sdk-core" }
lez-swap-store = { version = "0.1.0", path = "../swap-store" }
lez-xmr-swap-sdk = { version = "0.1.0", path = "../xmr-swap-sdk", optional = true }
lez-zec-swap-sdk = { version = "0.1.0", path = "../zec-swap-sdk", optional = true }
xmr-reference-actor = { version = "0.1.0", path = "../xmr-reference-actor", features = ["sessions"], optional = true }
zec-reference-actor = { version = "0.1.0", path = "../zec-reference-actor", optional = true }
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sd-notify = { version = "=0.5.0", default-features = false }
sha2 = "=0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
thiserror = "2.0.18"
wait-timeout = "=0.2.1"
zeroize = "=1.9.0"

[dev-dependencies]
zcash_primitives = { version = "=0.28.0", default-features = false, features = ["std"] }
lez-adaptor-role-runner = { version = "0.1.0", path = "../adaptor-role-runner" }
lez-taker-node = { version = "0.1.0", path = "../taker-node", features = ["pair-zec"] }
bitcoin = { version = "=0.32.101", default-features = false, features = ["std"] }
hex = "0.4.3"
jsonrpsee-http-client = { version = "0.26.0", default-features = false }
rusqlite = { version = "0.40.1", features = ["bundled"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc"] }
zcash_encoding = "=0.4.0"
zcash_protocol = { version = "=0.9.0", default-features = false }
zcash_transparent = { version = "=0.8.0", default-features = false, features = ["transparent-inputs"] }
