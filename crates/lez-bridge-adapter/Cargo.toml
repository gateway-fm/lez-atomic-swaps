[package]
name = "lez-bridge-adapter"
version = "0.1.0"
description = "Main-process LEZ bridge adapter for signed LEZ/ZEC swap agreements"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
getrandom = "0.3.4"
lez-bridge-client = { version = "0.1.0", path = "../lez-bridge-client" }
lez-bridge-protocol = { version = "0.1.0", path = "../lez-bridge-protocol" }
lez-btc-swap-sdk = { version = "0.1.0", path = "../btc-swap-sdk" }
lez-swap-core = { version = "0.1.0", path = "../swap-core" }
lez-swap-sdk-core = { version = "0.1.0", path = "../swap-sdk-core" }
lez-swap-store = { version = "0.1.0", path = "../swap-store" }
lez-zec-swap-sdk = { version = "0.1.0", path = "../zec-swap-sdk" }
lez-xmr-swap-sdk = { version = "0.1.0", path = "../xmr-swap-sdk" }
thiserror = "2.0.18"
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
jsonrpsee = { version = "0.26.0", features = ["server"] }
lez-adaptor-signature = { version = "0.1.0", path = "../adaptor-signature" }
rand_chacha = "=0.3.1"
serde_json = "1.0.140"
tower = "0.5.2"
tower-http = { version = "0.7.0", features = ["auth"] }
bitcoin = { version = "=0.32.101", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc"] }
sha2 = "=0.10.9"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }
zcash_protocol = { version = "=0.9.0", default-features = false }
zcash_transparent = { version = "=0.8.0", default-features = false, features = ["transparent-inputs"] }

[lints]
workspace = true
