[package]
name = "lez-xmr-release-authority"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
hex = "=0.4.3"
async-trait = "=0.1.89"
lez-bridge-client = { path = "../lez-bridge-client", version = "=0.1.0" }
chacha20poly1305 = "=0.10.1"
getrandom = "=0.3.4"
hkdf = "=0.12.4"
hmac = "=0.12.1"
lez-bridge-adapter = { path = "../lez-bridge-adapter", version = "=0.1.0" }
lez-bridge-protocol = { path = "../lez-bridge-protocol", version = "=0.1.0" }
lez-swap-core = { path = "../swap-core", version = "=0.1.0" }
lez-xmr-monero-adapter = { path = "../xmr-monero-adapter", version = "=0.1.0" }
lez-xmr-swap-sdk = { path = "../xmr-swap-sdk", version = "=0.1.0" }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = "=0.10.9"
thiserror = "=2.0.18"
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
digest_auth = { version = "=0.3.1", default-features = false }
jsonrpsee = { version = "0.26.0", features = ["server"] }
lez-adaptor-signature = { path = "../adaptor-signature", version = "=0.1.0" }
lez-bridge-client = { path = "../lez-bridge-client", version = "=0.1.0" }
monero-rpc = { version = "=0.5.1", default-features = false, features = ["rpc_authentication"] }
rand_chacha = "=0.3.1"
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc"] }
serde_json = "=1.0.150"
static_assertions = "=1.1.0"
tower = "0.5.2"
tower-http = { version = "0.7.0", features = ["auth"] }
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt", "sync"] }

[lints]
workspace = true
