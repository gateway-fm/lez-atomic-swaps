[package]
name = "lez-xmr-swap-sdk"
version = "0.1.0"
description = "Monero spend-key-share protocol adapter for LEZ atomic swaps"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
monero = { version = "=0.22.0", default-features = false }
musig2 = { version = "=0.4.1", default-features = false, features = ["secp256k1"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
rand_chacha = "=0.3.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
sigma_fun = { version = "=0.9.0", features = ["ed25519", "serde"] }
thiserror = "=2.0.18"
zeroize = "=1.9.0"

[dev-dependencies]
hex = "=0.4.3"
