[package]
name = "lez-bridge-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded serde protocol between the swap actors and the official LEZ v0.1.2 sidecar"

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.150"

[lints]
workspace = true
