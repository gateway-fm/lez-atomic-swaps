[package]
name = "btc-role-preflight"
version = "0.1.0"
description = "Role-local LEZ/Bitcoin agreement authority bootstrap"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.103"
bitcoin = { version = "=0.32.101", default-features = false, features = ["std"] }
clap = { version = "=4.6.1", features = ["derive"] }
getrandom = "=0.3.4"
hex = "=0.4.3"
lez-btc-swap-sdk = { version = "0.1.0", path = "../btc-swap-sdk" }
lez-swap-core = { version = "0.1.0", path = "../swap-core" }
libc = "=0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"
