[package]
name = "lez-zebra-node-adapter"
version = "0.1.0"
description = "Typed Zebra JSON-RPC adapter for LEZ/ZEC atomic swaps"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
hex = "0.4.3"
jsonrpsee = { version = "0.26.0", features = ["client-core"] }
jsonrpsee-http-client = { version = "0.26.0", default-features = false }
lez-swap-core = { version = "0.1.0", path = "../swap-core" }
lez-zec-swap-sdk = { version = "0.1.0", path = "../zec-swap-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
thiserror = "2.0.18"
zcash_encoding = "=0.4.0"
zcash_primitives = { version = "=0.28.0", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.9.0", default-features = false }
zcash_script = { version = "=0.4.3", default-features = false }
zcash_transparent = { version = "=0.8.0", default-features = false, features = ["transparent-inputs"] }

[dev-dependencies]
jsonrpsee-server = "0.26.0"
lez-swap-store = { version = "0.1.0", path = "../swap-store" }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }
