[workspace]

[package]
name = "lez-v0-1-2-sidecar"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[dependencies]
async-trait = "=0.1.89"
common = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.1.2" }
lez-bridge-protocol = { version = "=0.1.0", path = "../../crates/lez-bridge-protocol" }
lez-zec-escrow-compat = { version = "=0.0.0", path = "../spel-zec-escrow" }
nssa = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.1.2" }
spel-framework-core = { version = "=0.5.0", git = "https://github.com/logos-co/spel.git", rev = "73fc462eb8f0a4d00f1a846437c627ec2e523f83" }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["sync"] }

[dev-dependencies]
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "sync"] }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
