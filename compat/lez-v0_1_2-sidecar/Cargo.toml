[workspace]

[package]
name = "lez-v0-1-2-sidecar"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[dependencies]
async-trait = "=0.1.89"
borsh = { version = "=1.7.0", features = ["derive"] }
common = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.1.2" }
hex = "=0.4.3"
jsonrpsee = { version = "=0.26.0", features = ["server"] }
lez-bridge-protocol = { version = "=0.1.0", path = "../../crates/lez-bridge-protocol" }
lez-zec-escrow-compat = { version = "=0.0.0", path = "../spel-zec-escrow" }
nssa = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.1.2" }
sequencer_service_rpc = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.1.2", default-features = false, features = ["client"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
spel-framework-core = { version = "=0.5.0", git = "https://github.com/logos-co/spel.git", rev = "73fc462eb8f0a4d00f1a846437c627ec2e523f83" }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
] }
tower = "=0.5.3"
tower-http = { version = "=0.7.0", features = ["auth"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
lez-bridge-client = { version = "=0.1.0", path = "../../crates/lez-bridge-client" }
sequencer_service_protocol = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.1.2" }
sequencer_service_rpc = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.1.2", default-features = false, features = ["server"] }
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[[bin]]
name = "lez-v0-1-2-sidecar"
path = "src/bin/lez-v0-1-2-sidecar.rs"
