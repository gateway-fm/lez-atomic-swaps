[graph]
# The sidecar deployment artifact is Linux GNU. This excludes target-only EFI
# dependencies (including LGPL r-efi) that are not compiled into the artifact.
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Exact LEZ v0.1.2 forces rsa 0.9.10 through upstream RISC0/rzup, whose default install and publish features are active. This sidecar invokes no rzup API; rzup uses RSA-PSS signing/verification while this advisory affects RSA decryption. Treat as an isolated Logos-owned production blocker and re-audit or upgrade before deployment." },
    { id = "RUSTSEC-2025-0055", reason = "Exact LEZ v0.1.2 forces tracing-subscriber 0.2.25 through ark-relations, but the vulnerable fmt and ansi features are not activated in this graph. Re-audit before deployment or any feature/pin change." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { crate = "webpki-roots@1.0.8", allow = ["CDLA-Permissive-2.0"] },
]

# SPEL carries both files at this exact Git pin but omits Cargo license fields.
# Hash-locked clarifications fail closed if either upstream text changes.
[[licenses.clarify]]
crate = "spel-framework@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-core@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-macros@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EspressoSystems/jellyfish",
    "https://github.com/logos-blockchain/logos-blockchain.git",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/Overwatch",
    "https://github.com/logos-co/spel.git",
]
