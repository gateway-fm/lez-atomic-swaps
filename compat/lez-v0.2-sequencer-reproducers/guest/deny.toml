[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { crate = "risc0-zkvm@3.0.5", reason = "Yanked upstream on 2026-11-19 after risc0-zkvm 3.1.0 fixed GHSA-g6qg-9j8p-7j87 (Groth16 claim substitution and other soundness issues). The pin follows LEZ v0.2.4, and 3.1.0 receipts do not verify on older versions, so this graph cannot move alone. The advisory applies; it is an accepted risk on devnet-only software. Removed with the LEZ 0.4 port (#107); tracked in #184." },
    { crate = "risc0-groth16@3.0.5", reason = "Yanked upstream on 2026-11-19 after risc0-zkvm 3.1.0 fixed GHSA-g6qg-9j8p-7j87 (Groth16 claim substitution and other soundness issues). The pin follows LEZ v0.2.4, and 3.1.0 receipts do not verify on older versions, so this graph cannot move alone. The advisory applies; it is an accepted risk on devnet-only software. Removed with the LEZ 0.4 port (#107); tracked in #184." },
    { crate = "risc0-circuit-recursion@4.0.5", reason = "Yanked upstream on 2026-11-19 after risc0-zkvm 3.1.0 fixed GHSA-g6qg-9j8p-7j87 (Groth16 claim substitution and other soundness issues). The pin follows LEZ v0.2.4, and 3.1.0 receipts do not verify on older versions, so this graph cannot move alone. The advisory applies; it is an accepted risk on devnet-only software. Removed with the LEZ 0.4 port (#107); tracked in #184." },
    { id = "RUSTSEC-2025-0055", reason = "Exact Risc0 3.0.5 guest tooling forces tracing-subscriber 0.2.25 through arkworks. The guest is a test-only program that never logs and is never deployed. Re-audit on every Risc0 or LEZ pin change." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/logos-blockchain/logos-execution-zone.git",
]
