[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Exact LEZ v0.2.0 forces k256 0.13 -> elliptic-curve 0.13 -> crypto-bigint 0.5.5; the fixed 0.7.6 line is reachable only through the k256 0.14 pre-release. Constant-time variability in big-integer operations; re-audit on every k256/LEZ pin change and drop this entry when k256 0.14 ships." },
    { id = "RUSTSEC-2023-0071", reason = "Exact LEZ v0.2.0 forces rsa 0.9.10 through risc0/rzup host build tooling. The reproducers perform no RSA operation; the crate exists only to compile the test guest. Re-audit on every Risc0 or LEZ pin change." },
    { id = "RUSTSEC-2025-0055", reason = "Exact LEZ v0.2.0 forces tracing-subscriber 0.2.25 through risc0/arkworks. The reproducers log nothing through it and take no external input. Re-audit on every Risc0 or LEZ pin change." },
    { id = "RUSTSEC-2026-0118", reason = "Exact LEZ v0.2.0 forces hickory-proto 0.25.0-alpha.5 through the Logos Blockchain Zone SDK that sequencer_core links for its Bedrock publisher. The reproducers run sequencer_core with its mock publisher: the Zone SDK client is never constructed, no socket is opened, and no DNS message is parsed. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0119", reason = "Same hickory-proto pin as RUSTSEC-2026-0118; the mock publisher never encodes or decodes a DNS message. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0487", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (zone-file text parsing of SVCB/HTTPS `alpn` values). The reproducers run sequencer_core with its mock publisher: the Zone SDK client and its resolver are never constructed, no zone file or record text is parsed and no DNS message is decoded. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0489", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (zone-file text parsing of SVCB/HTTPS parameter values). The reproducers run sequencer_core with its mock publisher: the Zone SDK client and its resolver are never constructed, no zone file or record text is parsed and no DNS message is decoded. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0490", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (the zone-file lexer). The reproducers run sequencer_core with its mock publisher: the Zone SDK client and its resolver are never constructed, no zone file or record text is parsed and no DNS message is decoded. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0491", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (DNS message decoding). The reproducers run sequencer_core with its mock publisher: the Zone SDK client and its resolver are never constructed, no zone file or record text is parsed and no DNS message is decoded. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0505", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (NSEC3 owner names not checked against the zone in DNSSEC validation). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off in this graph (hickory-proto builds with tokio and tokio-runtime only); the reproducers run sequencer_core with its mock publisher, so the Zone SDK client and its resolver are never constructed and no DNS message is decoded. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0511", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (NXDOMAIN accepted for an empty non-terminal in NSEC validation). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off in this graph (hickory-proto builds with tokio and tokio-runtime only); the reproducers run sequencer_core with its mock publisher, so the Zone SDK client and its resolver are never constructed and no DNS message is decoded. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0512", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (an unrelated signed RRset accepted as the validated answer). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off in this graph (hickory-proto builds with tokio and tokio-runtime only); the reproducers run sequencer_core with its mock publisher, so the Zone SDK client and its resolver are never constructed and no DNS message is decoded. Re-audit before reusing this graph in any networked lane." },
    { id = "RUSTSEC-2026-0514", reason = "Same Hickory 0.25.0-alpha.5 pin as RUSTSEC-2026-0118, here in hickory-resolver (`Resolver::lookup` and `lookup_ip` returned records that failed DNSSEC validation). Those functions are compiled, but hickory-resolver 0.25.0-alpha.5 validates only with the dnssec-ring feature, which is off in this graph (system-config, tokio and tokio-runtime only), so this resolver never validates and has no failed validation to pass on; the reproducers run sequencer_core with its mock publisher, so the Zone SDK client and its resolver are never constructed and no DNS message is decoded. Re-audit before reusing this graph in any networked lane." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EspressoSystems/jellyfish",
    "https://github.com/logos-blockchain/logos-blockchain-circuits.git",
    "https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git",
    "https://github.com/logos-blockchain/logos-blockchain.git",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/Overwatch",
    "https://github.com/arkworks-rs/spongefish.git",
]
