[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { crate = "risc0-zkvm@3.0.5", reason = "Yanked upstream on 2026-11-19 after risc0-zkvm 3.1.0 fixed GHSA-g6qg-9j8p-7j87 (Groth16 claim substitution and other soundness issues). The pin follows LEZ v0.2.4, and 3.1.0 receipts do not verify on older versions, so this graph cannot move alone. The advisory applies; it is an accepted risk on devnet-only software. Removed with the LEZ 0.4 port (#107); tracked in #184." },
    { crate = "risc0-groth16@3.0.4", reason = "Yanked upstream on 2026-11-19 after risc0-zkvm 3.1.0 fixed GHSA-g6qg-9j8p-7j87 (Groth16 claim substitution and other soundness issues). The pin follows LEZ v0.2.4, and 3.1.0 receipts do not verify on older versions, so this graph cannot move alone. The advisory applies; it is an accepted risk on devnet-only software. Removed with the LEZ 0.4 port (#107); tracked in #184." },
    { crate = "risc0-circuit-recursion@4.0.4", reason = "Yanked upstream on 2026-11-19 after risc0-zkvm 3.1.0 fixed GHSA-g6qg-9j8p-7j87 (Groth16 claim substitution and other soundness issues). The pin follows LEZ v0.2.4, and 3.1.0 receipts do not verify on older versions, so this graph cannot move alone. The advisory applies; it is an accepted risk on devnet-only software. Removed with the LEZ 0.4 port (#107); tracked in #184." },
    { id = "RUSTSEC-2023-0071", reason = "Exact LEZ v0.1.2 forces rsa 0.9.10 through risc0/rzup; CI proves rzup publish/install features are absent, so no private-key operation is compiled into this compatibility fixture. Re-audit before deployment or pin changes." },
    { id = "RUSTSEC-2025-0055", reason = "Exact LEZ v0.1.2 forces tracing-subscriber 0.2.25 through risc0/arkworks; CI proves its vulnerable fmt and ansi features are absent. Re-audit before deployment or pin changes." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { crate = "webpki-roots@1.0.8", allow = ["CDLA-Permissive-2.0"] },
]

# SPEL carries both files at the exact Git pin but omits Cargo license fields.
# Hash-locked clarifications fail closed if either upstream text changes.
[[licenses.clarify]]
crate = "spel-framework@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-core@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-macros@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/spel.git",
]
