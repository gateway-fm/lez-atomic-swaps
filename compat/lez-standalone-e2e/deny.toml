[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Exact LEZ v0.1.2 forces rsa 0.9.10 through risc0/rzup; CI proves rzup publish/install features are absent, so no private-key operation is compiled into this compatibility-only standalone harness. Re-audit before deployment or pin changes." },
    { id = "RUSTSEC-2025-0055", reason = "Exact LEZ v0.1.2 forces tracing-subscriber 0.2.25 through risc0/arkworks; CI proves its vulnerable fmt and ansi features are absent. Re-audit before deployment or pin changes." },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/EspressoSystems/jellyfish",
    "https://github.com/logos-blockchain/logos-blockchain.git",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/Overwatch",
    "https://github.com/logos-co/spel.git",
]
