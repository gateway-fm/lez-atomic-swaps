[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Exact LEZ v0.2.0 forces k256 0.13 -> elliptic-curve 0.13 -> crypto-bigint 0.5.5 into this compile-only provisional fixture; the fixed 0.7.6 line is reachable only through the k256 0.14 pre-release. The fixture produces no runtime artifact and signs nothing; treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2026-0391", reason = "Exact LEZ v0.2.0 forces zstd 0.13 through sequencer storage; the fix is the 0.14 line (a major bump outside the pin). This graph only compiles the sequencer for the contract test and never reuses a zstd context across streams; treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2026-0398", reason = "Exact LEZ v0.2.0 forces zstd-safe 7.3 through sequencer storage; the fix is the 8.2 line (a major bump outside the pin). The seekable decompression API is not activated in this graph; treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2026-0403", reason = "Exact LEZ v0.2.0 forces zstd-safe 7.3 through sequencer storage; the fix is the 8.2 line (a major bump outside the pin). Legacy-frame streaming decompression is not used by this compile-only fixture; treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2023-0071", reason = "Exact LEZ v0.2.0 forces rsa 0.9.10 through risc0/rzup; CI proves rzup publish/install features are absent, so no private-key operation is compiled into this provisional compatibility fixture. Re-audit before deployment or pin changes." },
    { id = "RUSTSEC-2025-0055", reason = "Exact LEZ v0.2.0 forces tracing-subscriber 0.2.25 through risc0/arkworks; CI proves its vulnerable fmt and ansi features are absent. Re-audit before deployment or pin changes." },
    { id = "RUSTSEC-2026-0118", reason = "Exact LEZ v0.2.0 forces hickory-proto 0.25.0-alpha.5 through Logos Blockchain/libp2p. CI proves DNSSEC features are absent and the compile-only test never polls the standalone future. This exception is invalid for an executable sequencer or deployment lane." },
    { id = "RUSTSEC-2026-0119", reason = "Exact LEZ v0.2.0 forces hickory-proto 0.25.0-alpha.5 through Logos Blockchain/libp2p. The fixture produces no runtime artifact; CI hash-locks the compile-only test and proves it never polls or starts the service, so DNS message encoding is unreachable. Remove this exception before any executable v0.2 lane." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# SPEL carries both files at the exact PR head but omits Cargo license fields.
[[licenses.clarify]]
crate = "spel-framework@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-core@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-macros@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/keycard-tech/keycard-rs",
    "https://github.com/EspressoSystems/jellyfish",
    "https://github.com/logos-blockchain/logos-blockchain-circuits.git",
    "https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git",
    "https://github.com/logos-blockchain/logos-blockchain.git",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/Overwatch",
    "https://github.com/logos-co/spel.git",
    "https://github.com/arkworks-rs/spongefish.git",
]
