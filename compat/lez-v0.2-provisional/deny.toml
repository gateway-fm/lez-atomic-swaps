[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Exact LEZ v0.2.0 forces k256 0.13 -> elliptic-curve 0.13 -> crypto-bigint 0.5.5 into this compile-only provisional fixture; the fixed 0.7.6 line is reachable only through the k256 0.14 pre-release. The fixture produces no runtime artifact and signs nothing; treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2026-0391", reason = "Exact LEZ v0.2.0 forces zstd 0.13 through sequencer storage; the fix is the 0.14 line (a major bump outside the pin). This graph only compiles the sequencer for the contract test and never reuses a zstd context across streams; treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2026-0398", reason = "Exact LEZ v0.2.0 forces zstd-safe 7.3 through sequencer storage; the fix is the 8.2 line (a major bump outside the pin). The seekable decompression API is not activated in this graph; treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2026-0403", reason = "Exact LEZ v0.2.0 forces zstd-safe 7.3 through sequencer storage; the fix is the 8.2 line (a major bump outside the pin). Legacy-frame streaming decompression is not used by this compile-only fixture; treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2023-0071", reason = "Exact LEZ v0.2.0 forces rsa 0.9.10 through risc0/rzup; CI proves rzup publish/install features are absent, so no private-key operation is compiled into this provisional compatibility fixture. Re-audit before deployment or pin changes." },
    { id = "RUSTSEC-2025-0055", reason = "Exact LEZ v0.2.0 forces tracing-subscriber 0.2.25 through risc0/arkworks; CI proves its vulnerable fmt and ansi features are absent. Re-audit before deployment or pin changes." },
    { id = "RUSTSEC-2026-0118", reason = "Exact LEZ v0.2.0 forces hickory-proto 0.25.0-alpha.5 through Logos Blockchain/libp2p. CI proves DNSSEC features are absent and the compile-only test never polls the standalone future. This exception is invalid for an executable sequencer or deployment lane." },
    { id = "RUSTSEC-2026-0119", reason = "Exact LEZ v0.2.0 forces hickory-proto 0.25.0-alpha.5 through Logos Blockchain/libp2p. The fixture produces no runtime artifact; CI hash-locks the compile-only test and proves it never polls or starts the service, so DNS message encoding is unreachable. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0487", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (zone-file text parsing of SVCB/HTTPS `alpn` values). The fixture produces no runtime artifact; the compile-only test never polls or starts the service, so neither zone-file parsing nor DNS message decoding is reachable. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0489", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (zone-file text parsing of SVCB/HTTPS parameter values). The fixture produces no runtime artifact; the compile-only test never polls or starts the service, so neither zone-file parsing nor DNS message decoding is reachable. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0490", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (the zone-file lexer). The fixture produces no runtime artifact; the compile-only test never polls or starts the service, so neither zone-file parsing nor DNS message decoding is reachable. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0491", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (DNS message decoding). The fixture produces no runtime artifact; the compile-only test never polls or starts the service, so neither zone-file parsing nor DNS message decoding is reachable. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0505", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (NSEC3 owner names not checked against the zone in DNSSEC validation). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which CI proves absent (hickory-proto builds with tokio and tokio-runtime only); the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no resolver is constructed. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0511", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (NXDOMAIN accepted for an empty non-terminal in NSEC validation). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which CI proves absent (hickory-proto builds with tokio and tokio-runtime only); the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no resolver is constructed. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0512", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (an unrelated signed RRset accepted as the validated answer). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which CI proves absent (hickory-proto builds with tokio and tokio-runtime only); the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no resolver is constructed. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0514", reason = "Same Hickory 0.25.0-alpha.5 pin as RUSTSEC-2026-0118, here in hickory-resolver (`Resolver::lookup` and `lookup_ip` returned records that failed DNSSEC validation). Those functions are compiled, but hickory-resolver 0.25.0-alpha.5 validates only with the dnssec-ring feature, which CI proves absent (system-config, tokio and tokio-runtime only), so this resolver never validates and has no failed validation to pass on; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no resolver is constructed. Remove this exception before any executable v0.2 lane." },
    { id = "RUSTSEC-2026-0525", reason = "A remote peer panics a node through an expiring certificate during the QUIC handshake; needs a reachable QUIC listener. libp2p-quic 0.12.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; the fix is in 0.13.1, which needs a newer libp2p, so no lockfile-only update exists. No source in the fixture references libp2p; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no swarm, gossipsub behaviour, QUIC endpoint or resolver is constructed. Remove this exception before any executable v0.2 lane, or when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107)." },
    { id = "RUSTSEC-2026-0530", reason = "Parent-side NSEC at a zone cut accepted as proof of nonexistence in DNSSEC validation. Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118; no hickory-proto release has a fix (it moved to hickory-net 0.26.2). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off in this graph (hickory-proto builds with tokio and tokio-runtime only). No source in the fixture references libp2p; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no swarm, gossipsub behaviour, QUIC endpoint or resolver is constructed. Remove this exception before any executable v0.2 lane, or when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107)." },
    { id = "RUSTSEC-2026-0531", reason = "Child-side NSEC or NSEC3 accepted as proof that a delegation has no DS record in DNSSEC validation. Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118; no hickory-proto release has a fix (it moved to hickory-net 0.26.2). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off in this graph (hickory-proto builds with tokio and tokio-runtime only). No source in the fixture references libp2p; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no swarm, gossipsub behaviour, QUIC endpoint or resolver is constructed. Remove this exception before any executable v0.2 lane, or when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107)." },
    { id = "RUSTSEC-2026-0534", reason = "Unbounded backoff state from PRUNE messages for unknown topics; needs a running gossipsub behaviour. libp2p-gossipsub 0.48.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; every fixed release (0.49.x, 0.50.1) needs a newer libp2p, so no lockfile-only update exists. No source in the fixture references libp2p; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no swarm, gossipsub behaviour, QUIC endpoint or resolver is constructed. Remove this exception before any executable v0.2 lane, or when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107)." },
    { id = "RUSTSEC-2026-0535", reason = "Remote panic from an oversized PRUNE backoff; needs a running gossipsub behaviour. libp2p-gossipsub 0.48.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; every fixed release (0.49.x, 0.50.1) needs a newer libp2p, so no lockfile-only update exists. No source in the fixture references libp2p; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no swarm, gossipsub behaviour, QUIC endpoint or resolver is constructed. Remove this exception before any executable v0.2 lane, or when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107)." },
    { id = "RUSTSEC-2026-0536", reason = "Unbounded memory growth from GRAFT messages for unsubscribed topics; needs a running gossipsub behaviour. libp2p-gossipsub 0.48.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; every fixed release (0.49.x, 0.50.1) needs a newer libp2p, so no lockfile-only update exists. No source in the fixture references libp2p; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no swarm, gossipsub behaviour, QUIC endpoint or resolver is constructed. Remove this exception before any executable v0.2 lane, or when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107)." },
    { id = "RUSTSEC-2026-0537", reason = "Remote panic in the heartbeat from a large PRUNE backoff; needs a running gossipsub behaviour. libp2p-gossipsub 0.48.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; every fixed release (0.49.x, 0.50.1) needs a newer libp2p, so no lockfile-only update exists. No source in the fixture references libp2p; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no swarm, gossipsub behaviour, QUIC endpoint or resolver is constructed. Remove this exception before any executable v0.2 lane, or when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107)." },
    { id = "RUSTSEC-2026-0538", reason = "Receive loop can run without pause after a truncated datagram; needs a bound QUIC socket. quinn-udp 0.5.15 comes through quinn 0.11 under libp2p-quic, from the libp2p 0.55 that LEZ v0.2.4 pins; the affected receive path exists only on Apple, BSD, Solaris and illumos targets, and Linux, where the shipped images run, uses recvmmsg and is not affected. No source in the fixture references libp2p; the fixture produces no runtime artifact and the compile-only test never polls or starts the service, so no swarm, gossipsub behaviour, QUIC endpoint or resolver is constructed. Remove this exception before any executable v0.2 lane, or when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107)." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# SPEL carries both files at the exact PR head but omits Cargo license fields.
[[licenses.clarify]]
crate = "spel-framework@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-core@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-macros@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/keycard-tech/keycard-rs",
    "https://github.com/EspressoSystems/jellyfish",
    "https://github.com/logos-blockchain/logos-blockchain-circuits.git",
    "https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git",
    "https://github.com/logos-blockchain/logos-blockchain.git",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/Overwatch",
    "https://github.com/logos-co/spel.git",
    "https://github.com/arkworks-rs/spongefish.git",
]
