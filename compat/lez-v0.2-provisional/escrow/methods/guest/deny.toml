[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0385", reason = "ctutils 0.4.2 reaches the guest through exact LEZ v0.2.4 (lee_core -> chacha20 0.10 -> cipher 0.5 -> block-buffer 0.12 -> hybrid-array 0.4) and is compiled into the ELF; the escrow program's own code calls none of its mask or u128 comparison API. The guest ELF is pinned by digest and its program id is deployed on chain, so this lockfile does not move in a patch release (as RUSTSEC-2026-0285): the 0.4.4 fix is a re-pin exercise (new image id, new deployment). Treat as a Logos-owned production blocker and re-audit on every Risc0 or LEZ pin change." },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.23.42 sits in the guest graph only through the host-side build tooling (risc0-zkvm -> bonsai-sdk -> reqwest -> hyper-rustls); `cargo tree --target riscv32im-risc0-zkvm-elf` resolves none of rustls, rustls-webpki or webpki-roots for the zkVM target, so none of it is in the guest ELF and no TLS runs inside the guest. The guest ELF is pinned by digest and its program id is deployed on chain, so this lockfile does not move in a patch release (as RUSTSEC-2026-0285); the methods and deployer graphs are at rustls 0.23.46, rustls-webpki 0.103.16 and webpki-roots 1.0.11." },
    { id = "RUSTSEC-2026-0348", reason = "rustls 0.23.42 sits in the guest graph only through the host-side build tooling (risc0-zkvm -> bonsai-sdk -> reqwest -> hyper-rustls); `cargo tree --target riscv32im-risc0-zkvm-elf` resolves none of rustls, rustls-webpki or webpki-roots for the zkVM target, so none of it is in the guest ELF and no TLS runs inside the guest. The guest ELF is pinned by digest and its program id is deployed on chain, so this lockfile does not move in a patch release (as RUSTSEC-2026-0285); the methods and deployer graphs are at rustls 0.23.46, rustls-webpki 0.103.16 and webpki-roots 1.0.11." },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.23.42 sits in the guest graph only through the host-side build tooling (risc0-zkvm -> bonsai-sdk -> reqwest -> hyper-rustls); `cargo tree --target riscv32im-risc0-zkvm-elf` resolves none of rustls, rustls-webpki or webpki-roots for the zkVM target, so none of it is in the guest ELF and no TLS runs inside the guest. The guest ELF is pinned by digest and its program id is deployed on chain, so this lockfile does not move in a patch release (as RUSTSEC-2026-0285); the methods and deployer graphs are at rustls 0.23.46, rustls-webpki 0.103.16 and webpki-roots 1.0.11." },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.103.13 sits in the guest graph only through the host-side build tooling (risc0-zkvm -> bonsai-sdk -> reqwest -> hyper-rustls); `cargo tree --target riscv32im-risc0-zkvm-elf` resolves none of rustls, rustls-webpki or webpki-roots for the zkVM target, so none of it is in the guest ELF and no TLS runs inside the guest. The guest ELF is pinned by digest and its program id is deployed on chain, so this lockfile does not move in a patch release (as RUSTSEC-2026-0285); the methods and deployer graphs are at rustls 0.23.46, rustls-webpki 0.103.16 and webpki-roots 1.0.11." },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 1.0.8 sits in the guest graph only through the host-side build tooling (risc0-zkvm -> bonsai-sdk -> reqwest -> hyper-rustls); `cargo tree --target riscv32im-risc0-zkvm-elf` resolves none of rustls, rustls-webpki or webpki-roots for the zkVM target, so none of it is in the guest ELF and no TLS runs inside the guest. The guest ELF is pinned by digest and its program id is deployed on chain, so this lockfile does not move in a patch release (as RUSTSEC-2026-0285); the methods and deployer graphs are at rustls 0.23.46, rustls-webpki 0.103.16 and webpki-roots 1.0.11." },
    { id = "RUSTSEC-2023-0071", reason = "Exact Risc0 3.0.5 guest build tooling forces rsa 0.9.10 through rzup. The verifier proves rzup publish/install features are absent; no RSA private-key operation enters the escrow guest. Re-audit on every Risc0 or LEZ pin change." },
    { id = "RUSTSEC-2025-0055", reason = "Exact Risc0 3.0.5 guest build tooling forces tracing-subscriber 0.2.25 through arkworks. The verifier proves vulnerable fmt and ansi features are absent. Re-audit on every Risc0 or LEZ pin change." },
    { id = "RUSTSEC-2026-0285", reason = "rustls 0.23.42 sits in the guest graph only through the host-side build tooling (reqwest, quinn); no TLS runs inside the zkVM guest. The guest ELF is pinned by digest and its program id is deployed on chain, so this lockfile does not move in a patch release; the workspace, sidecar, reproducers, provisional root and deployer graphs are at rustls 0.23.45." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { crate = "webpki-roots@1.0.8", allow = ["CDLA-Permissive-2.0"] },
]

[[licenses.clarify]]
crate = "spel-framework@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-core@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-macros@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/spel.git",
]
