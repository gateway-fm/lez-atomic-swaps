[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Exact Risc0 3.0.5 guest build tooling forces rsa 0.9.10 through rzup. The verifier proves rzup publish/install features are absent; no RSA private-key operation enters the escrow guest. Re-audit on every Risc0 or LEZ pin change." },
    { id = "RUSTSEC-2025-0055", reason = "Exact Risc0 3.0.5 guest build tooling forces tracing-subscriber 0.2.25 through arkworks. The verifier proves vulnerable fmt and ansi features are absent. Re-audit on every Risc0 or LEZ pin change." },
    { crate = "spin@0.9.8", reason = "Exact LEZ v0.2.0 and Risc0 tooling force this yanked version through lazy_static and the Logos proof graph. The guest invokes no spin API and retains an exact inverse-dependency gate. Treat as Logos-owned and re-audit on every pin change." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { crate = "webpki-roots@1.0.8", allow = ["CDLA-Permissive-2.0"] },
]

[[licenses.clarify]]
crate = "spel-framework@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-core@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-macros@0.5.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/spel.git",
]
