[workspace]

[package]
name = "lez-v0-2-xmr-release-service"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[dependencies]
anyhow = "=1.0.103"
async-trait = "=0.1.89"
clap = { version = "=4.6.1", features = ["derive"] }
indexer_service_protocol = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", default-features = false }
indexer_service_rpc = { version = "=0.1.0", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", default-features = false, features = ["client"] }
jsonrpsee = { version = "=0.26.0", features = ["http-client"] }
lez-bridge-adapter = { version = "=0.1.0", path = "../../crates/lez-bridge-adapter" }
lez-bridge-protocol = { version = "=0.1.0", path = "../../crates/lez-bridge-protocol" }
lez-xmr-release-authority = { version = "=0.1.0", path = "../../crates/xmr-release-authority" }
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
