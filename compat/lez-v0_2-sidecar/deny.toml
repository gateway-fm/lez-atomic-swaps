[graph]
# The sidecar deployment artifact is Linux GNU. This excludes target-only EFI
# dependencies that are not compiled into the artifact.
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Exact LEZ v0.2.0 forces k256 0.13 -> elliptic-curve 0.13 -> crypto-bigint 0.5.5; the fixed 0.7.6 line is reachable only through the k256 0.14 pre-release. Constant-time variability in big-integer operations; re-audit on every k256/LEZ pin change and drop this entry when k256 0.14 ships." },
    { id = "RUSTSEC-2023-0071", reason = "Exact LEZ v0.2.0 forces rsa 0.9.10 through upstream RISC0/rzup. This sidecar invokes no rzup API; rzup uses RSA-PSS signing and verification while this advisory affects RSA decryption. Treat as a Logos-owned production blocker and re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2025-0055", reason = "Exact LEZ v0.2.0 forces tracing-subscriber 0.2.25 through ark-relations, but its vulnerable fmt and ansi features are not activated in this graph. Re-audit before deployment or any pin/feature change." },
    { id = "RUSTSEC-2026-0118", reason = "Exact LEZ v0.2.0 forces hickory-proto 0.25.0-alpha.5 through Logos libp2p. The vulnerable DNSSEC features are not activated, and this sidecar uses an explicit loopback IP HTTP sequencer endpoint rather than DNS/libp2p. Treat as a Logos-owned production blocker and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0119", reason = "Exact LEZ v0.2.0 forces hickory-proto 0.25.0-alpha.5 through Logos libp2p. This sidecar does not instantiate the transitive DNS/libp2p stack or encode DNS messages; it uses an explicit loopback IP HTTP sequencer endpoint. Treat as a Logos-owned production blocker and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0487", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (zone-file text parsing of SVCB/HTTPS `alpn` values). hickory-proto is in the graph only as libp2p-dns -> hickory-resolver under the Logos Blockchain crates the LEZ v0.2 wallet types link; this sidecar never constructs that libp2p stack or its resolver, parses no zone file or record text, and its HTTP client resolves names through the system resolver. Logos-owned; re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0489", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (zone-file text parsing of SVCB/HTTPS parameter values). hickory-proto is in the graph only as libp2p-dns -> hickory-resolver under the Logos Blockchain crates the LEZ v0.2 wallet types link; this sidecar never constructs that libp2p stack or its resolver, parses no zone file or record text, and its HTTP client resolves names through the system resolver. Logos-owned; re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0490", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (the zone-file lexer). hickory-proto is in the graph only as libp2p-dns -> hickory-resolver under the Logos Blockchain crates the LEZ v0.2 wallet types link; this sidecar never constructs that libp2p stack or its resolver, parses no zone file or record text, and its HTTP client resolves names through the system resolver. Logos-owned; re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0491", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (DNS message decoding). hickory-proto is in the graph only as libp2p-dns -> hickory-resolver under the Logos Blockchain crates the LEZ v0.2 wallet types link; this sidecar never constructs that libp2p stack or its resolver, parses no zone file or record text, and its HTTP client resolves names through the system resolver. Logos-owned; re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0505", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (NSEC3 owner names not checked against the zone in DNSSEC validation). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off here: hickory-proto builds with tokio and tokio-runtime only, and check-dependency-policy.sh fails if a dnssec feature appears; hickory is in the graph only as libp2p-dns -> hickory-resolver under the Logos Blockchain crates the LEZ v0.2 wallet types link, this sidecar never constructs that libp2p stack or its resolver, and its HTTP client resolves names through the system resolver. Logos-owned; re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0511", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (NXDOMAIN accepted for an empty non-terminal in NSEC validation). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off here: hickory-proto builds with tokio and tokio-runtime only, and check-dependency-policy.sh fails if a dnssec feature appears; hickory is in the graph only as libp2p-dns -> hickory-resolver under the Logos Blockchain crates the LEZ v0.2 wallet types link, this sidecar never constructs that libp2p stack or its resolver, and its HTTP client resolves names through the system resolver. Logos-owned; re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0512", reason = "Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118 (an unrelated signed RRset accepted as the validated answer). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off here: hickory-proto builds with tokio and tokio-runtime only, and check-dependency-policy.sh fails if a dnssec feature appears; hickory is in the graph only as libp2p-dns -> hickory-resolver under the Logos Blockchain crates the LEZ v0.2 wallet types link, this sidecar never constructs that libp2p stack or its resolver, and its HTTP client resolves names through the system resolver. Logos-owned; re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0514", reason = "Same Hickory 0.25.0-alpha.5 pin as RUSTSEC-2026-0118, here in hickory-resolver (`Resolver::lookup` and `lookup_ip` returned records that failed DNSSEC validation). Those functions are compiled, but hickory-resolver 0.25.0-alpha.5 validates only with the dnssec-ring feature, which is off here (system-config, tokio and tokio-runtime only), so this resolver never validates and has no failed validation to pass on; hickory is in the graph only as libp2p-dns -> hickory-resolver under the Logos Blockchain crates the LEZ v0.2 wallet types link, this sidecar never constructs that libp2p stack or its resolver, and its HTTP client resolves names through the system resolver. Logos-owned; re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0525", reason = "A remote peer panics a node through an expiring certificate during the QUIC handshake; needs a reachable QUIC listener. libp2p-quic 0.12.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; the fix is in 0.13.1, which needs a newer libp2p, so no lockfile-only update exists. No source in this sidecar, nor in the LEZ wallet, common, key_protocol and sequencer RPC crates it uses, constructs a libp2p swarm, gossipsub behaviour, QUIC endpoint or resolver; the stack is linked only because logos-blockchain-common-http-client uses chain-service types, and the sidecar reaches the sequencer over HTTP; check-dependency-policy.sh fails if sidecar source references libp2p or quinn. Logos-owned; remove when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107) and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0530", reason = "Parent-side NSEC at a zone cut accepted as proof of nonexistence in DNSSEC validation. Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118; no hickory-proto release has a fix (it moved to hickory-net 0.26.2). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off in this graph (hickory-proto builds with tokio and tokio-runtime only). No source in this sidecar, nor in the LEZ wallet, common, key_protocol and sequencer RPC crates it uses, constructs a libp2p swarm, gossipsub behaviour, QUIC endpoint or resolver; the stack is linked only because logos-blockchain-common-http-client uses chain-service types, and the sidecar reaches the sequencer over HTTP; check-dependency-policy.sh fails if sidecar source references libp2p or quinn. Logos-owned; remove when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107) and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0531", reason = "Child-side NSEC or NSEC3 accepted as proof that a delegation has no DS record in DNSSEC validation. Same hickory-proto 0.25.0-alpha.5 pin as RUSTSEC-2026-0118; no hickory-proto release has a fix (it moved to hickory-net 0.26.2). hickory-proto 0.25.0-alpha.5 compiles its DNSSEC validator only with the dnssec-ring feature, which is off in this graph (hickory-proto builds with tokio and tokio-runtime only). No source in this sidecar, nor in the LEZ wallet, common, key_protocol and sequencer RPC crates it uses, constructs a libp2p swarm, gossipsub behaviour, QUIC endpoint or resolver; the stack is linked only because logos-blockchain-common-http-client uses chain-service types, and the sidecar reaches the sequencer over HTTP; check-dependency-policy.sh fails if sidecar source references libp2p or quinn. Logos-owned; remove when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107) and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0534", reason = "Unbounded backoff state from PRUNE messages for unknown topics; needs a running gossipsub behaviour. libp2p-gossipsub 0.48.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; every fixed release (0.49.x, 0.50.1) needs a newer libp2p, so no lockfile-only update exists. No source in this sidecar, nor in the LEZ wallet, common, key_protocol and sequencer RPC crates it uses, constructs a libp2p swarm, gossipsub behaviour, QUIC endpoint or resolver; the stack is linked only because logos-blockchain-common-http-client uses chain-service types, and the sidecar reaches the sequencer over HTTP; check-dependency-policy.sh fails if sidecar source references libp2p or quinn. Logos-owned; remove when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107) and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0535", reason = "Remote panic from an oversized PRUNE backoff; needs a running gossipsub behaviour. libp2p-gossipsub 0.48.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; every fixed release (0.49.x, 0.50.1) needs a newer libp2p, so no lockfile-only update exists. No source in this sidecar, nor in the LEZ wallet, common, key_protocol and sequencer RPC crates it uses, constructs a libp2p swarm, gossipsub behaviour, QUIC endpoint or resolver; the stack is linked only because logos-blockchain-common-http-client uses chain-service types, and the sidecar reaches the sequencer over HTTP; check-dependency-policy.sh fails if sidecar source references libp2p or quinn. Logos-owned; remove when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107) and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0536", reason = "Unbounded memory growth from GRAFT messages for unsubscribed topics; needs a running gossipsub behaviour. libp2p-gossipsub 0.48.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; every fixed release (0.49.x, 0.50.1) needs a newer libp2p, so no lockfile-only update exists. No source in this sidecar, nor in the LEZ wallet, common, key_protocol and sequencer RPC crates it uses, constructs a libp2p swarm, gossipsub behaviour, QUIC endpoint or resolver; the stack is linked only because logos-blockchain-common-http-client uses chain-service types, and the sidecar reaches the sequencer over HTTP; check-dependency-policy.sh fails if sidecar source references libp2p or quinn. Logos-owned; remove when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107) and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0537", reason = "Remote panic in the heartbeat from a large PRUNE backoff; needs a running gossipsub behaviour. libp2p-gossipsub 0.48.0 comes from the libp2p 0.55 that LEZ v0.2.4 pins through the Logos Blockchain crates; every fixed release (0.49.x, 0.50.1) needs a newer libp2p, so no lockfile-only update exists. No source in this sidecar, nor in the LEZ wallet, common, key_protocol and sequencer RPC crates it uses, constructs a libp2p swarm, gossipsub behaviour, QUIC endpoint or resolver; the stack is linked only because logos-blockchain-common-http-client uses chain-service types, and the sidecar reaches the sequencer over HTTP; check-dependency-policy.sh fails if sidecar source references libp2p or quinn. Logos-owned; remove when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107) and re-audit before any transport/pin/feature change." },
    { id = "RUSTSEC-2026-0538", reason = "Receive loop can run without pause after a truncated datagram; needs a bound QUIC socket. quinn-udp 0.5.15 comes through quinn 0.11 under libp2p-quic, from the libp2p 0.55 that LEZ v0.2.4 pins; the affected receive path exists only on Apple, BSD, Solaris and illumos targets, and Linux, where the shipped images run, uses recvmmsg and is not affected. No source in this sidecar, nor in the LEZ wallet, common, key_protocol and sequencer RPC crates it uses, constructs a libp2p swarm, gossipsub behaviour, QUIC endpoint or resolver; the stack is linked only because logos-blockchain-common-http-client uses chain-service types, and the sidecar reaches the sequencer over HTTP; check-dependency-policy.sh fails if sidecar source references libp2p or quinn. Logos-owned; remove when LEZ moves off libp2p 0.55 (port to LEZ 0.4, issue #107) and re-audit before any transport/pin/feature change." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    { crate = "webpki-roots@1.0.11", allow = ["CDLA-Permissive-2.0"] },
]

[[licenses.clarify]]
crate = "spel-framework@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-core@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[[licenses.clarify]]
crate = "spel-framework-macros@0.6.0"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "../LICENSE-MIT", hash = 0x6193b12d },
    { path = "../LICENSE-APACHE-v2", hash = 0x0b75c107 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/keycard-tech/keycard-rs",
    "https://github.com/EspressoSystems/jellyfish",
    "https://github.com/arkworks-rs/spongefish.git",
    "https://github.com/logos-blockchain/logos-blockchain-circuits.git",
    "https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git",
    "https://github.com/logos-blockchain/logos-blockchain.git",
    "https://github.com/logos-blockchain/logos-execution-zone.git",
    "https://github.com/logos-co/Overwatch",
    "https://github.com/logos-co/spel.git",
]
